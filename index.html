<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EZ-Board v2 - Professional Notebook Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-dark: #1a1a2e;
            --bg-light: #f5f5f7;
            --toolbar-dark: #16213e;
            --toolbar-light: #ffffff;
            --border-dark: #0f3460;
            --border-light: #e0e0e0;
            --accent: #e94560;
            --accent-hover: #ff6b8a;
            --text-dark: #ffffff;
            --text-light: #333333;
            --page-bg-dark: #16181d;
            --page-bg-light: #ffffff;
            --grid-minor-dark: rgba(255,255,255,0.035);
            --grid-major-dark: rgba(255,255,255,0.08);
            --grid-minor-light: rgba(0,0,0,0.05);
            --grid-major-light: rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            overflow: hidden;
            height: 100vh;
            transition: background 0.3s;
        }

        body.light {
            background: var(--bg-light);
        }

        /* App Container */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background: var(--toolbar-dark);
            color: var(--text-dark);
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-dark);
            z-index: 100;
            transition: all 0.3s;
        }

        body.light .toolbar {
            background: var(--toolbar-light);
            color: var(--text-light);
            border-bottom-color: var(--border-light);
        }

        .tool-group {
            display: flex;
            gap: 4px;
            padding: 0 8px;
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        body.light .tool-group {
            border-right-color: rgba(0,0,0,0.1);
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: inherit;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tool-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        body.light .tool-btn:hover {
            background: rgba(0,0,0,0.05);
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
        }

        .color-picker-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-picker-btn:hover {
            transform: scale(1.1);
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 8px;
        }

        .size-control input {
            width: 100px;
        }

        .page-indicator {
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Favorite Pens Bar */
        .favorite-pens-bar {
            display: flex;
            gap: 4px;
            padding: 0 8px;
            border-left: 1px solid rgba(255,255,255,0.2);
            border-right: 1px solid rgba(255,255,255,0.2);
        }

        body.light .favorite-pens-bar {
            border-left-color: rgba(0,0,0,0.1);
            border-right-color: rgba(0,0,0,0.1);
        }

        .fav-pen-slot {
            width: 44px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            position: relative;
        }

        body.light .fav-pen-slot {
            background: rgba(0,0,0,0.05);
        }

        .fav-pen-slot:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        .fav-pen-slot.active {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .fav-pen-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-bottom: 2px;
        }

        .fav-pen-size {
            font-size: 8px;
            color: inherit;
        }

        .fav-pen-overflow {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            font-weight: bold;
        }

        body.light .fav-pen-overflow {
            background: rgba(0,0,0,0.05);
        }

        .fav-pen-overflow:hover {
            background: var(--accent);
        }

        /* Floating editor popup */
        .floating-editor {
            position: fixed;
            background: var(--toolbar-dark);
            color: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            z-index: 2000;
            min-width: 220px;
        }

        .floating-editor * {
            color: white;
        }

        body.light .floating-editor {
            background: var(--toolbar-light);
        }

        body.light .floating-editor * {
            color: var(--text-light);
        }

        .editor-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .editor-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .editor-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        .editor-slider {
            flex: 1;
        }

        .editor-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .editor-buttons button {
            padding: 4px 12px;
        }

        /* Main Area */
        .main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--toolbar-dark);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid var(--border-dark);
            transition: width 0.3s ease, opacity 0.2s ease;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 0;
            opacity: 0;
            overflow: hidden;
            border-right: none;
        }

        body.light .sidebar {
            background: var(--toolbar-light);
            color: var(--text-light);
            border-right-color: var(--border-light);
        }

        .sidebar-header {
            padding: 16px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light .sidebar-header {
            border-bottom-color: var(--border-light);
        }

        .page-list {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .page-thumb {
            background: rgba(0,0,0,0.2);
            margin-bottom: 12px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 12px;
        }

        body.light .page-thumb {
            background: rgba(0,0,0,0.05);
        }

        .page-thumb:hover {
            background: var(--accent);
            transform: translateX(4px);
        }

        .page-thumb.active {
            background: var(--accent);
            border-left: 3px solid #ffd700;
        }

        /* Right Sidebar - Notebook Library */
        .right-sidebar {
            width: 280px;
            background: var(--toolbar-dark);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-left: 1px solid var(--border-dark);
            transition: width 0.3s ease, opacity 0.2s ease;
            flex-shrink: 0;
        }

        .right-sidebar.collapsed {
            width: 0;
            opacity: 0;
            overflow: hidden;
            border-left: none;
        }

        body.light .right-sidebar {
            background: var(--toolbar-light);
            color: var(--text-light);
            border-left-color: var(--border-light);
        }

        .right-sidebar-header {
            padding: 16px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        body.light .right-sidebar-header {
            border-bottom-color: var(--border-light);
        }

        .notebook-list {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .notebook-item {
            background: rgba(0,0,0,0.2);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        body.light .notebook-item {
            background: rgba(0,0,0,0.05);
        }

        .notebook-item:hover {
            background: var(--accent);
            transform: translateX(-4px);
        }

        .notebook-item.active {
            background: var(--accent);
            border-right: 3px solid #ffd700;
        }

        .notebook-title {
            font-weight: bold;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notebook-meta {
            font-size: 10px;
            opacity: 0.7;
        }

        .notebook-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .notebook-actions button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: inherit;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
        }

        .notebook-actions button:hover {
            background: rgba(255,255,255,0.2);
        }

        .pinned {
            color: #ffd700;
        }

        .page-thumb canvas {
            width: 100%;
            height: auto;
            background: var(--page-bg-light);
            border-radius: 4px;
            margin-bottom: 6px;
        }

        body.light .page-thumb canvas {
            background: var(--page-bg-light);
        }

        /* Canvas Container */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-dark);
        }

        body.light .canvas-container {
            background: var(--bg-light);
        }

        .viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .pages-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            transform-origin: 0 0;
            transition: transform 0.05s ease-out;
        }

        .page-container {
            position: relative;
            margin: 20px auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            background: white;
            transform-origin: 0 0;
        }

        .page-canvas {
            display: block;
            cursor: crosshair;
            touch-action: none;
        }

        .live-canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Selection overlay */
        .selection-overlay {
            position: absolute;
            border: 2px solid var(--accent);
            background: rgba(233, 69, 96, 0.1);
            pointer-events: none;
            z-index: 10;
        }

        /* Lasso drawing */
        .lasso-path {
            position: absolute;
            stroke: var(--accent);
            stroke-width: 2;
            fill: rgba(233, 69, 96, 0.1);
            pointer-events: none;
            z-index: 20;
        }

        /* Status bar */
        .status-bar {
            background: var(--toolbar-dark);
            padding: 4px 16px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-dark);
        }

        body.light .status-bar {
            background: var(--toolbar-light);
            border-top-color: var(--border-light);
        }

        .save-status {
            color: #4ade80;
        }

        .save-status.dirty {
            color: #fbbf24;
        }

        /* Scrollbar */
        .viewport::-webkit-scrollbar {
            width: 10px;
        }

        .viewport::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        .viewport::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 5px;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="tool-group">
            <button class="tool-btn" id="toggleSidebarBtn" title="Toggle Sidebar">☰ Pages</button>
            <button class="tool-btn" id="penBtn" title="Pen (P)">✏️ Pen</button>
            <button class="tool-btn" id="eraserBtn" title="Eraser (E)">🧽 Eraser</button>
            <button class="tool-btn" id="lassoBtn" title="Lasso (L)">🔍 Lasso</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">↩️ Undo</button>
            <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)">↪️ Redo</button>
        </div>
        
        <!-- Favorite Pens Bar -->
        <div class="favorite-pens-bar" id="favoritePensBar"></div>
        
        <div class="tool-group">
            <button class="tool-btn" id="gridBtn" title="Toggle Grid (G)">📐 Grid</button>
            <button class="tool-btn" id="darkModeBtn" title="Dark Mode (D)">🌙 Dark</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" id="newPageBtn" title="New Page">📄 New</button>
            <button class="tool-btn" id="duplicatePageBtn" title="Duplicate Page">📋 Duplicate</button>
            <button class="tool-btn" id="deletePageBtn" title="Delete Page">🗑️ Delete</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" id="exportPdfBtn" title="Export PDF">📑 Export PDF</button>
            <button class="tool-btn" id="saveBtn" title="Save (Ctrl+S)">💾 Save</button>
        </div>
        <div class="page-indicator" id="pageIndicator">Page: 1</div>
        <div class="page-indicator" id="notebookIndicator" style="margin-left: 8px; background: var(--accent);">📓 Loading...</div>
        <div style="margin-left: auto;">
            <button class="tool-btn" id="toggleRightSidebarBtn" title="Toggle Notebooks">📚 Notebooks</button>
        </div>
    </div>
    <div class="main-area">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📖 Pages</span>
                <button class="tool-btn" id="addPageSidebar" style="padding: 4px 8px;">+</button>
            </div>
            <div class="page-list" id="pageList"></div>
        </div>
        <div class="canvas-container">
            <div class="viewport" id="viewport">
                <div class="pages-wrapper" id="pagesWrapper"></div>
            </div>
        </div>
        <div class="right-sidebar" id="rightSidebar">
            <div class="right-sidebar-header">
                <span>📚 Notebooks</span>
                <button class="tool-btn" id="newNotebookBtn" style="padding: 4px 8px;">+</button>
            </div>
            <div class="notebook-list" id="notebookList"></div>
        </div>
    </div>
    <div class="status-bar">
        <span id="statusText">Ready</span>
        <span class="save-status" id="saveStatus">✓ All saved</span>
    </div>
</div>

<script>
    // ============ CONFIGURATION ============
    const PAGE_WIDTH = 800;
    const PAGE_HEIGHT = 1100;
    const VIRTUAL_BUFFER = 1;
    const DPR = window.devicePixelRatio || 1;
    
    // Pen width mapping (1.0 -> 1.5px for better visibility)
    function mapPenWidth(size) {
        return Math.max(1.5, size + 0.5);
    }

    // ============ GLOBAL STATE ============
    let note = {
        id: 'notebook_' + Date.now(),
        title: 'My Notebook',
        pages: [],
        currentPageIndex: 0,
        theme: 'dark',
        version: '2.0'
    };

    let currentTool = 'pen';
    let currentColor = '#000000';
    let currentSize = 3;
    let isDrawing = false;
    let currentStroke = null;
    let currentPageId = null;
    
    // Eraser modes
    let eraserMode = 'point'; // 'point' or 'stroke'
    
    // Lasso state
    let isLassoSelecting = false;
    let lassoPoints = [];
    let selectedStrokeIds = new Set();
    
    // Lasso drag/move state
    let isDraggingSelection = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartStrokePositions = new Map(); // strokeId -> array of original points
    let dragPreviewStroke = null; // For preview during drag
    let isMovingSelection = false;
    let selectionOffset = null;
    let clipboard = [];
    
    // Zoom
    let currentZoom = 1.0;
    let minZoom = 0.25;
    let maxZoom = 8.0;
    
    // History
    let historyStack = [];
    let historyIndex = -1;
    let historyTimer = null;
    
    // DOM Elements
    const viewport = document.getElementById('viewport');
    const pagesWrapper = document.getElementById('pagesWrapper');
    const pageList = document.getElementById('pageList');
    const pageIndicator = document.getElementById('pageIndicator');
    const saveStatus = document.getElementById('saveStatus');
    const statusText = document.getElementById('statusText');
    
    // ============ PAGE ID NORMALIZATION ============
    function normalizePageId(id) {
        return String(id);
    }
    
    // ============ CREATE EMPTY PAGE ============
    function createEmptyPage(background = 'grid') {
        return {
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
            strokes: [],
            background: background,
            dirty: false,
            thumbnail: null,
            lastSaved: null,
            createdAt: Date.now()
        };
    }
    
    // ============ STROKE SMOOTHING ============
    // Removed weighted averaging - causes lag. Using direct pass-through.
    // Quadratic bezier curves provide natural smoothing without lag.
    class StrokeSmoother {
        constructor() {
            this.lastPoint = null;
        }
        
        smoothPoint(newPoint) {
            // Direct pass-through - curves handle smoothing naturally
            this.lastPoint = newPoint;
            return newPoint;
        }
        
        reset() {
            this.lastPoint = null;
        }
    }
    
    let strokeSmoother = new StrokeSmoother();
    
    // ============ PAGE MANAGER ============
    class PageManager {
        constructor() {
            this.loadedPages = new Map();
            this.dirtyPages = new Set();
            this.saveTimer = null;
            this.db = null;
            this.initDB();
        }
        
        async initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('EZBoardV2', 1);
                
                request.onerror = () => {
                    console.error('IndexedDB error');
                    reject();
                };
                
                request.onsuccess = () => {
                    this.db = request.result;
                    resolve();
                };
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('notebooks')) {
                        db.createObjectStore('notebooks', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('pages')) {
                        db.createObjectStore('pages', { keyPath: 'id' });
                    }
                };
            });
        }
        
        createPage(background = 'grid') {
            const pageId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const newPage = {
                id: pageId,
                index: note.pages.length,
                strokes: [],
                background: background,
                zoom: 1,
                dirty: true,
                thumbnail: null,
                lastSaved: null,
                createdAt: Date.now()
            };
            note.pages.push(newPage);
            this.markDirty(pageId);
            this.saveToHistory();
            this.renderPage(pageId);
            return newPage;
        }
        
        getPage(pageId) {
            return note.pages.find(p => p.id === pageId);
        }
        
        deletePage(pageId) {
            const index = note.pages.findIndex(p => p.id === pageId);
            if (index !== -1 && note.pages.length > 1) {
                note.pages.splice(index, 1);
                this.loadedPages.delete(pageId);
                this.saveToHistory();
                this.refreshSidebar();
                this.renderVisiblePages();
                return true;
            }
            return false;
        }
        
        duplicatePage(pageId) {
            const originalPage = this.getPage(pageId);
            if (originalPage) {
                const newPage = {
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                    index: note.pages.length,
                    strokes: JSON.parse(JSON.stringify(originalPage.strokes)),
                    background: originalPage.background,
                    zoom: 1,
                    dirty: true,
                    thumbnail: null,
                    lastSaved: null,
                    createdAt: Date.now()
                };
                note.pages.push(newPage);
                this.markDirty(newPage.id);
                this.saveToHistory();
                this.renderPage(newPage.id);
                this.refreshSidebar();
                this.renderVisiblePages();
                return newPage;
            }
            return null;
        }
        
        addStroke(pageId, stroke) {
            const page = this.getPage(pageId);
            if (page) {
                page.strokes.push(stroke);
                this.markDirty(pageId);
                this.renderPage(pageId);
                return true;
            }
            return false;
        }
        
        removeStroke(pageId, strokeId) {
            const page = this.getPage(pageId);
            if (page) {
                const index = page.strokes.findIndex(s => s.id === strokeId);
                if (index !== -1) {
                    page.strokes.splice(index, 1);
                    this.markDirty(pageId);
                    this.renderPage(pageId);
                    return true;
                }
            }
            return false;
        }
        
        erasePoint(pageId, point, radius) {
            const page = this.getPage(pageId);
            if (!page) return false;
            
            let modified = false;
            const newStrokes = [];
            
            for (const stroke of page.strokes) {
                let hitIndex = -1;
                for (let i = 0; i < stroke.points.length; i++) {
                    const p = stroke.points[i];
                    const dx = p.x - point.x;
                    const dy = p.y - point.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < radius) {
                        hitIndex = i;
                        break;
                    }
                }
                
                if (hitIndex === -1) {
                    newStrokes.push(stroke);
                } else if (hitIndex > 0 && hitIndex < stroke.points.length - 1) {
                    // Split stroke
                    const stroke1 = {
                        ...stroke,
                        id: stroke.id + '_split1_' + Date.now(),
                        points: stroke.points.slice(0, hitIndex)
                    };
                    const stroke2 = {
                        ...stroke,
                        id: stroke.id + '_split2_' + Date.now(),
                        points: stroke.points.slice(hitIndex + 1)
                    };
                    if (stroke1.points.length >= 2) newStrokes.push(stroke1);
                    if (stroke2.points.length >= 2) newStrokes.push(stroke2);
                    modified = true;
                } else {
                    modified = true;
                }
            }
            
            if (modified) {
                page.strokes = newStrokes;
                this.markDirty(pageId);
                this.renderPage(pageId);
            }
            return modified;
        }
        
        markDirty(pageId) {
            const page = this.getPage(pageId);
            if (page) {
                page.dirty = true;
                this.dirtyPages.add(pageId);
                this.scheduleAutoSave();
                this.updateSaveStatus();
            }
        }
        
        scheduleAutoSave() {
            if (this.saveTimer) clearTimeout(this.saveTimer);
            this.saveTimer = setTimeout(() => this.saveAllDirtyPages(), 3000);
        }
        
        async loadPageFromDB(pageId) {
            if (!this.db) return null;
            
            return new Promise((resolve, reject) => {
                const transaction = this.db.transaction(['pages'], 'readonly');
                const store = transaction.objectStore('pages');
                const request = store.get(pageId);
                
                request.onsuccess = () => {
                    const pageData = request.result;
                    if (pageData) {
                        resolve({
                            id: pageData.id,
                            strokes: pageData.strokes || [],
                            background: pageData.background || 'grid',
                            dirty: false,
                            thumbnail: pageData.thumbnail,
                            lastSaved: pageData.lastSaved
                        });
                    } else {
                        resolve(null);
                    }
                };
                request.onerror = () => reject(request.error);
            });
        }
        
        async saveAllDirtyPages() {
            for (const pageId of this.dirtyPages) {
                await this.savePage(pageId);
            }
            this.dirtyPages.clear();
            this.updateSaveStatus();
            
            // Update status with timestamp
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
            statusText.textContent = `Saved ${timeStr}`;
            setTimeout(() => {
                if (statusText.textContent.includes('Saved')) statusText.textContent = 'Ready';
            }, 2000);
        }
        
        async savePage(pageId) {
            const page = this.getPage(pageId);
            if (page && page.dirty) {
                page.dirty = false;
                page.lastSaved = Date.now();
                await this.generateThumbnail(pageId);
                
                if (this.db) {
                    const tx = this.db.transaction(['pages'], 'readwrite');
                    const store = tx.objectStore('pages');
                    store.put({
                        id: pageId,
                        notebookId: note.id,
                        strokes: page.strokes,
                        background: page.background,
                        thumbnail: page.thumbnail
                    });
                }
                
                statusText.textContent = `Saved page ${note.pages.findIndex(p => p.id === pageId) + 1}`;
                setTimeout(() => {
                    if (statusText.textContent.includes('Saved')) statusText.textContent = 'Ready';
                }, 2000);
            }
        }
        
        async generateThumbnail(pageId) {
            const page = this.getPage(pageId);
            const loaded = this.loadedPages.get(normalizePageId(pageId));
            if (page && loaded && loaded.canvas) {
                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = 120;
                thumbCanvas.height = 165;
                const thumbCtx = thumbCanvas.getContext('2d');
                
                // Draw with increased brightness for better visibility
                thumbCtx.fillStyle = note.theme === 'dark' ? '#1a1a2e' : '#ffffff';
                thumbCtx.fillRect(0, 0, 120, 165);
                
                // Scale and draw with opacity adjustment
                thumbCtx.save();
                thumbCtx.globalAlpha = 1;
                thumbCtx.drawImage(loaded.canvas, 0, 0, loaded.canvas.width, loaded.canvas.height, 0, 0, 120, 165);
                thumbCtx.restore();
                
                page.thumbnail = thumbCanvas.toDataURL();
                this.refreshSidebar();
            }
        }
        
        renderPage(pageId) {
            const page = this.getPage(pageId);
            if (!page) return;
            
            let loaded = this.loadedPages.get(normalizePageId(pageId));
            const renderScale = Math.min(DPR * currentZoom, 8); // Cap at 8x for memory safety
            
            if (!loaded) {
                const canvas = document.createElement('canvas');
                canvas.className = 'page-canvas';
                canvas.setAttribute('data-page-id', pageId);
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                loaded = { canvas, ctx, strokes: [], liveCanvas: null, liveCtx: null };
                this.loadedPages.set(normalizePageId(pageId), loaded);
            }
            
            // Zoom-aware canvas sizing
            loaded.canvas.width = PAGE_WIDTH * renderScale;
            loaded.canvas.height = PAGE_HEIGHT * renderScale;
            loaded.canvas.style.width = (PAGE_WIDTH * currentZoom) + 'px';
            loaded.canvas.style.height = (PAGE_HEIGHT * currentZoom) + 'px';
            loaded.ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
            loaded.ctx.imageSmoothingEnabled = true;
            loaded.ctx.imageSmoothingQuality = 'high';
            
            // Create live overlay canvas for drawing
            if (!loaded.liveCanvas) {
                loaded.liveCanvas = document.createElement('canvas');
                loaded.liveCanvas.className = 'live-canvas';
                loaded.liveCanvas.style.position = 'absolute';
                loaded.liveCanvas.style.top = '0';
                loaded.liveCanvas.style.left = '0';
                loaded.liveCtx = loaded.liveCanvas.getContext('2d');
                loaded.liveCtx.imageSmoothingEnabled = true;
                loaded.liveCtx.imageSmoothingQuality = 'high';
            }
            
            loaded.liveCanvas.width = PAGE_WIDTH * renderScale;
            loaded.liveCanvas.height = PAGE_HEIGHT * renderScale;
            loaded.liveCanvas.style.width = (PAGE_WIDTH * currentZoom) + 'px';
            loaded.liveCanvas.style.height = (PAGE_HEIGHT * currentZoom) + 'px';
            loaded.liveCtx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
            loaded.liveCtx.imageSmoothingEnabled = true;
            loaded.liveCtx.imageSmoothingQuality = 'high';
            
            // Clear main canvas with paper-like background
            loaded.ctx.fillStyle = note.theme === 'dark' ? '#111827' : '#ffffff';
            loaded.ctx.fillRect(0, 0, PAGE_WIDTH, PAGE_HEIGHT);
            
            // Draw grid if enabled
            if (page.background === 'grid') {
                this.drawGrid(loaded.ctx, pageId);
            }
            
            // Draw all strokes with single-path rendering
            for (const stroke of page.strokes) {
                this.drawStroke(loaded.ctx, stroke);
            }
            
            // Clear live overlay with correct transform reset
            loaded.liveCtx.save();
            loaded.liveCtx.setTransform(1, 0, 0, 1, 0, 0);
            loaded.liveCtx.clearRect(0, 0, loaded.liveCanvas.width, loaded.liveCanvas.height);
            loaded.liveCtx.restore();
            
            // Update DOM - only add if not already present, never replace
            const container = document.querySelector(`.page-container[data-page-id="${pageId}"]`);
            if (container) {
                const existingCanvas = container.querySelector('.page-canvas');
                const existingLive = container.querySelector('.live-canvas');
                if (!existingCanvas) {
                    container.appendChild(loaded.canvas);
                }
                if (!existingLive && loaded.liveCanvas) {
                    container.appendChild(loaded.liveCanvas);
                }
            }
        }
        
        drawGrid(ctx, pageId) {
            const minorGrid = 28;
            const majorGrid = 112; // 4 minor cells per major block (28*4=112)
            const startX = 0;
            const startY = 0;
            const endX = PAGE_WIDTH;
            const endY = PAGE_HEIGHT;
            
            const isDark = note.theme === 'dark';
            
            // GoodNotes-style grid colors
            const minorColor = isDark
                ? 'rgba(110, 130, 190, 0.08)'
                : 'rgba(0, 0, 0, 0.06)';
            
            const majorColor = isDark
                ? 'rgba(110, 130, 190, 0.16)'
                : 'rgba(0, 0, 0, 0.12)';
            
            ctx.save();
            
            // Draw minor grid lines
            ctx.beginPath();
            ctx.strokeStyle = minorColor;
            ctx.lineWidth = 0.5;
            
            for (let x = startX; x <= endX; x += minorGrid) {
                if (x % majorGrid !== 0) {
                    ctx.moveTo(x, startY);
                    ctx.lineTo(x, endY);
                    ctx.stroke();
                }
            }
            
            for (let y = startY; y <= endY; y += minorGrid) {
                if (y % majorGrid !== 0) {
                    ctx.moveTo(startX, y);
                    ctx.lineTo(endX, y);
                    ctx.stroke();
                }
            }
            
            // Draw major grid lines
            ctx.beginPath();
            ctx.strokeStyle = majorColor;
            ctx.lineWidth = 1;
            
            for (let x = startX; x <= endX; x += majorGrid) {
                ctx.moveTo(x, startY);
                ctx.lineTo(x, endY);
                ctx.stroke();
            }
            
            for (let y = startY; y <= endY; y += majorGrid) {
                ctx.moveTo(startX, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        drawStroke(ctx, stroke) {
            if (!stroke.points || stroke.points.length < 2) return;
            
            // Single path for entire stroke - eliminates fuzzy overlapping
            ctx.beginPath();
            ctx.strokeStyle = stroke.color;
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Map pen width for better visibility - constant width for entire stroke
            const baseWidth = mapPenWidth(stroke.size);
            const firstPressure = stroke.points[0].pressure || 0.5;
            ctx.lineWidth = baseWidth * (0.7 + firstPressure * 0.5);
            
            // Move to first point
            ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
            
            // Use quadratic bezier curves for smoothness
            for (let i = 1; i < stroke.points.length - 1; i++) {
                const p1 = stroke.points[i];
                const p2 = stroke.points[i + 1];
                
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                
                ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
            }
            
            ctx.stroke();
        }
        
        updateSaveStatus() {
            const dirtyCount = this.dirtyPages.size;
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
            
            if (dirtyCount === 0) {
                saveStatus.textContent = `✓ Saved ${timeStr}`;
                saveStatus.classList.remove('dirty');
            } else {
                saveStatus.textContent = `● Unsaved (${dirtyCount})`;
                saveStatus.classList.add('dirty');
            }
        }
        
        refreshSidebar() {
            pageList.innerHTML = '';
            note.pages.forEach((page, idx) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'page-thumb';
                if (idx === note.currentPageIndex) thumbDiv.classList.add('active');
                
                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = 120;
                thumbCanvas.height = 165;
                const thumbCtx = thumbCanvas.getContext('2d');
                
                if (page.thumbnail) {
                    const img = new Image();
                    img.onload = () => thumbCtx.drawImage(img, 0, 0, 120, 165);
                    img.src = page.thumbnail;
                } else {
                    thumbCtx.fillStyle = note.theme === 'dark' ? '#1e1e1e' : '#f5f5f5';
                    thumbCtx.fillRect(0, 0, 120, 165);
                    thumbCtx.fillStyle = note.theme === 'dark' ? '#888' : '#999';
                    thumbCtx.font = '12px Arial';
                    thumbCtx.fillText(`${idx + 1}`, 55, 85);
                }
                
                thumbDiv.appendChild(thumbCanvas);
                const label = document.createElement('div');
                label.textContent = `Page ${idx + 1}`;
                thumbDiv.appendChild(label);
                
                thumbDiv.onclick = () => this.navigateToPage(idx);
                pageList.appendChild(thumbDiv);
            });
        }
        
        navigateToPage(index) {
            if (index < 0 || index >= note.pages.length) return;
            
            // Save current page if dirty before leaving
            const currentPage = note.pages[note.currentPageIndex];
            if (currentPage && currentPage.dirty) {
                this.savePage(currentPage.id);
            }
            
            note.currentPageIndex = index;
            this.refreshSidebar();
            pageIndicator.textContent = `Page: ${index + 1}`;
            this.renderVisiblePages(false); // Scroll to new page
        }
        
        renderVisiblePages(keepViewport = false) {
            pagesWrapper.innerHTML = '';
            const startPage = Math.max(0, note.currentPageIndex - VIRTUAL_BUFFER);
            const endPage = Math.min(note.pages.length - 1, note.currentPageIndex + VIRTUAL_BUFFER);
            
            for (let i = startPage; i <= endPage; i++) {
                const page = note.pages[i];
                let loaded = this.loadedPages.get(normalizePageId(page.id));
                if (!loaded) {
                    this.renderPage(page.id);
                    loaded = this.loadedPages.get(normalizePageId(page.id));
                }
                if (loaded && loaded.canvas) {
                    const container = document.createElement('div');
                    container.className = 'page-container';
                    container.setAttribute('data-page-id', page.id);
                    container.style.position = 'relative';
                    container.appendChild(loaded.canvas);
                    if (loaded.liveCanvas) {
                        container.appendChild(loaded.liveCanvas);
                    }
                    pagesWrapper.appendChild(container);
                }
            }
            
            // No CSS transform scaling - pages render at correct zoom resolution
            
            // Only scroll to page on navigation, not on undo/redo/zoom
            if (!keepViewport) {
                setTimeout(() => {
                    const currentContainer = document.querySelector(`.page-container[data-page-id="${note.pages[note.currentPageIndex]?.id}"]`);
                    if (currentContainer) {
                        currentContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
        }
        
        getPageUnderPointer(clientY) {
            const containers = document.querySelectorAll('.page-container');
            for (const container of containers) {
                const rect = container.getBoundingClientRect();
                if (clientY >= rect.top && clientY <= rect.bottom) {
                    const pageId = container.getAttribute('data-page-id');
                    const canvas = container.querySelector('.page-canvas');
                    return { pageId, canvas, rect };
                }
            }
            return null;
        }
        
        getLocalCoordinates(canvas, rect, clientX, clientY) {
            // Fixed DPI coordinate bug: Use PAGE_WIDTH/HEIGHT, not canvas.width (which includes DPR)
            const x = ((clientX - rect.left) / rect.width) * PAGE_WIDTH;
            const y = ((clientY - rect.top) / rect.height) * PAGE_HEIGHT;
            return { x: Math.max(0, Math.min(PAGE_WIDTH, x)), y: Math.max(0, Math.min(PAGE_HEIGHT, y)) };
        }
        
        saveToHistory() {
            if (historyTimer) clearTimeout(historyTimer);
            historyTimer = setTimeout(() => {
                const snapshot = JSON.parse(JSON.stringify(note.pages));
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(snapshot);
                historyIndex++;
                if (historyStack.length > 100) {
                    historyStack.shift();
                    historyIndex--;
                }
            }, 500);
        }
        
        undo() {
            if (historyIndex > 0) {
                historyIndex--;
                note.pages = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                this.loadedPages.clear();
                for (let i = 0; i < note.pages.length; i++) {
                    this.renderPage(note.pages[i].id);
                }
                this.renderVisiblePages(true); // Keep viewport position
                this.refreshSidebar();
                statusText.textContent = 'Undo';
                setTimeout(() => statusText.textContent = 'Ready', 1000);
            }
        }
        
        redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                note.pages = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                this.loadedPages.clear();
                for (let i = 0; i < note.pages.length; i++) {
                    this.renderPage(note.pages[i].id);
                }
                this.renderVisiblePages(true); // Keep viewport position
                this.refreshSidebar();
                statusText.textContent = 'Redo';
                setTimeout(() => statusText.textContent = 'Ready', 1000);
            }
        }
        
        toggleGrid() {
            const page = note.pages[note.currentPageIndex];
            if (page) {
                page.background = page.background === 'grid' ? 'blank' : 'grid';
                this.markDirty(page.id);
                this.renderPage(page.id);
                statusText.textContent = page.background === 'grid' ? 'Grid on' : 'Grid off';
                setTimeout(() => statusText.textContent = 'Ready', 1000);
            }
        }
        
        toggleTheme() {
            note.theme = note.theme === 'dark' ? 'light' : 'dark';
            document.body.classList.toggle('light', note.theme === 'light');
            
            // Re-render all pages with new theme
            for (const page of note.pages) {
                this.renderPage(page.id);
            }
            this.renderVisiblePages();
            this.refreshSidebar();
            
            const btn = document.getElementById('darkModeBtn');
            btn.innerHTML = note.theme === 'dark' ? '🌙 Dark' : '☀️ Light';
            statusText.textContent = note.theme === 'dark' ? 'Dark mode' : 'Light mode';
            setTimeout(() => statusText.textContent = 'Ready', 1000);
        }
        
        async exportToPDF() {
            statusText.textContent = 'Generating PDF...';
            
            try {
                // Check if jsPDF is available
                if (typeof window.jspdf === 'undefined') {
                    throw new Error('jsPDF library not loaded');
                }
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'px',
                    format: [PAGE_WIDTH, PAGE_HEIGHT]
                });
                
                // Process each page
                for (let i = 0; i < note.pages.length; i++) {
                    const page = note.pages[i];
                    
                    // Ensure page is rendered
                    let loaded = this.loadedPages.get(page.id);
                    if (!loaded) {
                        this.renderPage(page.id);
                        loaded = this.loadedPages.get(page.id);
                    }
                    
                    if (loaded && loaded.canvas) {
                        // Convert canvas to image data
                        const imageData = loaded.canvas.toDataURL('image/png');
                        
                        if (i === 0) {
                            // First page - add directly
                            pdf.addImage(imageData, 'PNG', 0, 0, PAGE_WIDTH, PAGE_HEIGHT);
                        } else {
                            // Subsequent pages - add new page first
                            pdf.addPage([PAGE_WIDTH, PAGE_HEIGHT]);
                            pdf.addImage(imageData, 'PNG', 0, 0, PAGE_WIDTH, PAGE_HEIGHT);
                        }
                    }
                }
                
                // Save the PDF
                const filename = `${note.title.replace(/[^a-z0-9]/gi, '_')}.pdf`;
                pdf.save(filename);
                
                statusText.textContent = `PDF exported: ${note.pages.length} pages`;
                setTimeout(() => statusText.textContent = 'Ready', 3000);
                
            } catch (error) {
                console.error('PDF export error:', error);
                statusText.textContent = 'PDF export failed';
                setTimeout(() => statusText.textContent = 'Ready', 3000);
                
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = 'PDF export failed. Please refresh and try again.';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        }
    }

    let favoritePens = [];

    function loadFavoritePens() {
        const saved = localStorage.getItem('ezboard_favorite_pens');
        if (saved) {
            favoritePens = JSON.parse(saved);
        } else {
            // Default favorite pens
            favoritePens = [

                { color: '#3b82f6', size: 2 },
                { color: '#f59e0b', size: 5 }
            ];

        renderFavoritePensBar();

    function saveFavoritePens() {
        localStorage.setItem('ezboard_favorite_pens', JSON.stringify(favoritePens));
    }
    
    function renderFavoritePensBar() {
        const container = document.getElementById('favoritePensBar');
        if (!container) return;
        
        container.innerHTML = '';
        const displayCount = Math.min(5, favoritePens.length);
        
        for (let i = 0; i < displayCount; i++) {
            const pen = favoritePens[i];

                e.stopPropagation();

    function openFavoriteEditor(index) {
        const pen = favoritePens[index];
        if (!pen) return;
        
        // Remove existing editor
        if (currentFavoriteEditor) currentFavoriteEditor.remove();
        
        const editor = document.createElement('div');
        editor.className = 'floating-editor';

    // Load notebooks from localStorage (temporary - will upgrade to IndexedDB)
    function loadNotebooks() {
        const saved = localStorage.getItem('ezboard_notebooks');
        if (saved) {
            notebooks = JSON.parse(saved);
        } else {
            // Create default notebook
            notebooks = [{
                id: 'notebook_' + Date.now(),

                updatedAt: Date.now(),
                pinned: true
            }];

        if (lastNotebookId && notebooks.find(n => n.id === lastNotebookId)) {
            loadNotebook(lastNotebookId);
        } else if (notebooks.length > 0) {

    function saveNotebooks() {

    function persistCurrentNotebook() {
        if (!currentNotebookId) return;
        const notebook = notebooks.find(n => n.id === currentNotebookId);
        if (notebook) {
            notebook.pages = JSON.parse(JSON.stringify(note.pages));
            notebook.updatedAt = Date.now();
            notebook.title = note.title;
            saveNotebooks();
            renderNotebookList();

    function renderNotebookList() {
        const container = document.getElementById('notebookList');
        if (!container) return;
        
        container.innerHTML = '';
        const sorted = [...notebooks].sort((a, b) => {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            return b.updatedAt - a.updatedAt;
        });
        
        sorted.forEach(notebook => {
            const item = document.createElement('div');
            item.className = 'notebook-item';
            if (notebook.id === currentNotebookId) item.classList.add('active');
            
            item.innerHTML = `
                <div class="notebook-title">
                    <span>${notebook.pinned ? '📌 ' : '📓 '}${escapeHtml(notebook.title)}</span>
                    <span class="notebook-meta">${new Date(notebook.updatedAt).toLocaleDateString()}</span>
                </div>
                <div class="notebook-meta">${notebook.pages?.length || 0} pages</div>
                <div class="notebook-actions">
                    <button class="rename-notebook" data-id="${notebook.id}">Rename</button>
                    <button class="pin-notebook" data-id="${notebook.id}">${notebook.pinned ? 'Unpin' : 'Pin'}</button>
                    <button class="delete-notebook" data-id="${notebook.id}">Delete</button>

            item.addEventListener('click', (e) => {

                loadNotebook(notebook.id);

                deleteNotebook(id);

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function deleteNotebook(id) {
        const notebook = notebooks.find(n => n.id === id);
        if (notebook && confirm(`Delete "${notebook.title}" and all its pages?`)) {
            const index = notebooks.findIndex(n => n.id === id);
            notebooks.splice(index, 1);
            saveNotebooks();
            
            if (notebooks.length === 0) {
                // Create default notebook if none left
                createNotebook();
            } else if (currentNotebookId === id) {
                loadNotebook(notebooks[0].id);
            } else {
                renderNotebookList();
            }
        }
    }
    
    async function loadNotebook(id) {
        const notebook = notebooks.find(n => n.id === id);
        if (notebook) {
            console.log("LOADING NOTEBOOK", notebook);
            currentNotebookId = id;
            note.title = notebook.title;
            note.id = id;
            
            // Load pages from IndexedDB (not from localStorage metadata)
            const loadedPages = [];
            for (const pageMeta of notebook.pages) {
                const pageFromDB = await pageManager.loadPageFromDB(pageMeta.id);
                if (pageFromDB) {
                    loadedPages.push(pageFromDB);
                } else {
                    // Fallback to metadata if DB doesn't have it yet
                    loadedPages.push(pageMeta);
                }
            }
            note.pages = loadedPages;
            
            // Validate and migrate pages - ensure no page has id === 1
            let needsSave = false;
            for (let i = 0; i < note.pages.length; i++) {
                const page = note.pages[i];
                // Migrate old page IDs (number 1) to unique IDs
                if (page.id === 1 || typeof page.id === 'number') {
                    console.warn('Migrating old page ID', page.id, 'to unique ID');
                    page.id = Date.now() + '_' + Math.random().toString(36).substr(2, 9) + '_migrated_' + i;
                    needsSave = true;
                }
                // Ensure page has required fields
                if (!page.strokes) page.strokes = [];
                if (!page.background) page.background = 'grid';
                if (!page.createdAt) page.createdAt = Date.now();
            }
            
            // Filter out any invalid pages
            note.pages = note.pages.filter(p => p && p.id && Array.isArray(p.strokes));
            
            console.log("NOTEBOOK PAGE IDS", note.pages.map(p => p.id));
            
            // Save if migration occurred
            if (needsSave) {
                await updateCurrentNotebook();
            }
            
            // Update UI - noteTitle element removed, so skip
            // document.getElementById('noteTitle').value = note.title;
            
            // Clear and reload page manager
            pageManager.loadedPages.clear();
            pageManager.historyStack = [];
            pageManager.historyIndex = -1;
            
            for (let i = 0; i < note.pages.length; i++) {
                await pageManager.renderPage(note.pages[i].id);
            }
            pageManager.renderVisiblePages();
            pageManager.refreshSidebar();
            pageManager.navigateToPage(0);
            
            console.log("LOADED PAGES", pageManager.loadedPages);
            console.log("NOTE PAGES", note.pages);
            
            // Verify page count matches
            const sidebarCount = document.querySelectorAll('.page-thumb').length;
            if (sidebarCount !== note.pages.length) {
                console.warn(`Page count mismatch! Sidebar: ${sidebarCount}, Note pages: ${note.pages.length}`);
            }
            
            renderNotebookList();
            
            // Update notebook indicator
            const notebookIndicator = document.getElementById('notebookIndicator');
            if (notebookIndicator) {
                notebookIndicator.textContent = `📓 ${note.title}`;
            }
            
            // Track last opened notebook
            localStorage.setItem('ezboard_last_notebook', currentNotebookId);
            
            // Update window title
            document.title = `EZ-Board - ${note.title}`;
            
            statusText.textContent = `Loaded: ${notebook.title}`;
            setTimeout(() => statusText.textContent = 'Ready', 2000);
        }
    }

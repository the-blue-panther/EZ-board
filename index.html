    /**
     * Called when user submits the Save Note form.
     * Creates a brand-new note in IndexedDB with the current canvas state.
     */
    async saveNote() {
        const titleInput = document.getElementById('noteTitle');
        const title = titleInput ? titleInput.value.trim() : '';
        if (!title) { alert('Please enter a note title'); return; }

        const now = new Date();
        const noteDateValue = document.getElementById('noteDateTime') ? document.getElementById('noteDateTime').value : '';
        const noteDate = noteDateValue ? new Date(noteDateValue) : now;

        const note = {
            id: Date.now(),
            title,
            pinned: false,
            deleted: false,
            createdAt: now.toISOString(),
            updatedAt: now.toISOString(),
            noteDate: noteDate.toISOString(),
            stateData: {
                items: this.items.map(i => this.serializeItem(i)),
                mode: this.mode,
                backgroundStyle: this.backgroundStyle,
                canvasHeight: this.canvasHeight
            },
            previewImage: this.canvas.toDataURL('image/jpeg', 0.35),
        };

        try {
            await this.storage.saveNote(note);
            await this.syncNoteToFolder(note);
            this.currentNoteId = note.id;
            localStorage.setItem('lastActiveNoteId', note.id.toString());
            if (titleInput) titleInput.value = '';
            this.setDefaultNoteDateTime();
            await this.loadNotes();
            this.updateSaveState('saved');
            // Show active note bar
            const activeBar = document.getElementById('activeNoteBar');
            const activeTitle = document.getElementById('activeNoteTitle');
            if (activeBar && activeTitle) { activeBar.style.display = 'flex'; activeTitle.textContent = note.title; }
        } catch(e) {
            console.error('saveNote form error:', e);
            alert('Failed to save note. Please try again.');
        }
    }

    /**
     * Loads and renders the notes list with search, sort, filter, tab, and grouping.
     * Called whenever the sidebar needs a refresh.
     */
    async loadNotes() {
        const list = document.getElementById('notesList');
        if (!list) return;

        let allNotes = [];
        try {
            allNotes = await this.storage.getAllNotes();
        } catch(e) {
            console.error('loadNotes: storage error:', e);
            list.innerHTML = '<div style="text-align:center;color:var(--accent-red);padding:20px;font-size:13px;">Failed to load notes.</div>';
            return;
        }

        const inTrash = this.notesTab === 'trash';

        // Partition by tab
        let notes = inTrash
            ? allNotes.filter(n => n.deleted)
            : allNotes.filter(n => !n.deleted);

        // Apply search
        if (this.notesSearchQuery) {
            const q = this.notesSearchQuery;
            notes = notes.filter(n => (n.title || '').toLowerCase().includes(q));
        }

        // Apply pin-only filter (only in active tab)
        if (!inTrash && this.notesPinnedOnly) {
            notes = notes.filter(n => n.pinned);
        }

        // Apply sort
        switch (this.notesSortBy) {
            case 'date-asc':
                notes.sort((a, b) => new Date(a.updatedAt || a.createdAt || 0) - new Date(b.updatedAt || b.createdAt || 0));
                break;
            case 'title-asc':
                notes.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                break;
            case 'title-desc':
                notes.sort((a, b) => (b.title || '').localeCompare(a.title || ''));
                break;
            default: // 'date-desc'
                notes.sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
        }

        if (!notes.length) {
            list.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">${inTrash ? 'Trash is empty' : 'No notes yet — start drawing!'}</div>`;
            this.highlightActiveNote();
            return;
        }

        if (inTrash) {
            // Trash view — flat list with Restore / Delete Permanently actions
            list.innerHTML = notes.map(n => this.renderNoteItemHTML(n, true)).join('');
        } else {
            // Active view — group by pinned + time buckets
            const pinned = notes.filter(n => n.pinned);
            const unpinned = notes.filter(n => !n.pinned);

            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const yesterdayStart = todayStart - 86400000;
            const weekStart = todayStart - 6 * 86400000;

            const todays = unpinned.filter(n => new Date(n.updatedAt || n.createdAt || 0).getTime() >= todayStart);
            const yesterdays = unpinned.filter(n => { const t = new Date(n.updatedAt || n.createdAt || 0).getTime(); return t >= yesterdayStart && t < todayStart; });
            const thisWeek = unpinned.filter(n => { const t = new Date(n.updatedAt || n.createdAt || 0).getTime(); return t >= weekStart && t < yesterdayStart; });
            const older = unpinned.filter(n => new Date(n.updatedAt || n.createdAt || 0).getTime() < weekStart);

            const renderGroup = (label, items) => {
                if (!items.length) return '';
                return `<div class="note-group-header">${label}</div>` + items.map(n => this.renderNoteItemHTML(n, false)).join('');
            };

            list.innerHTML = [
                renderGroup('📌 Pinned', pinned),
                renderGroup('Today', todays),
                renderGroup('Yesterday', yesterdays),
                renderGroup('This Week', thisWeek),
                renderGroup('Older', older),
            ].join('');
        }

        this.highlightActiveNote();
    }

    /**
     * Returns the HTML string for a single note card.
     * @param {object} note - note object
     * @param {boolean} inTrash - whether rendering in trash view
     */
    renderNoteItemHTML(note, inTrash) {
        const title = this.escapeHtml(note.title || 'Untitled');
        const updated = this.formatDateShort(note.updatedAt || note.createdAt);
        const created = this.formatDateShort(note.createdAt);
        const pinLabel = note.pinned ? '<span class="pin-label">📌 </span>' : '';
        const activeClass = (note.id === this.currentNoteId && !inTrash) ? ' active-note' : '';

        if (inTrash) {
            return `
            <div class="note-item${activeClass}" data-id="${note.id}">
                <div class="note-title">🗑 ${title}</div>
                <div class="note-meta"><span>Deleted · ${updated}</span></div>
                <div class="note-actions">
                    <button onclick="whiteboard.restoreNote(${note.id})">♻ Restore</button>
                    <button class="del" onclick="whiteboard.deleteNotePermanently(${note.id})">✕ Delete Forever</button>
                </div>
            </div>`;
        }

        return `
        <div class="note-item${activeClass}" data-id="${note.id}" onclick="whiteboard.loadNote(${note.id})">
            <div class="note-title">${pinLabel}${title}</div>
            <div class="note-meta">
                <span>Created ${created}</span>
                <span>↺ ${updated}</span>
            </div>
            <div class="note-actions">
                <button onclick="event.stopPropagation(); whiteboard.renameNote(${note.id})">✏ Rename</button>
                <button onclick="event.stopPropagation(); whiteboard.togglePinNote(${note.id})">${note.pinned ? '📌 Unpin' : '📌 Pin'}</button>
                <button class="del" onclick="event.stopPropagation(); whiteboard.deleteNote(${note.id})">🗑 Delete</button>
            </div>
        </div>`;
    }

    async loadNote(id) {
        const note = await this.storage.getNote(id);
        if (!note || note.deleted) return;

        this.currentNoteId = id;
        localStorage.setItem('lastActiveNoteId', id.toString());

        // Show active note bar
        const activeBar = document.getElementById('activeNoteBar');
        const activeTitle = document.getElementById('activeNoteTitle');
        if (activeBar && activeTitle) {
            activeBar.style.display = 'flex';
            activeTitle.textContent = note.title;
        }

        if (note.stateData && Array.isArray(note.stateData.items)) {
            this.items = note.stateData.items;
            this.mode = note.stateData.mode || this.mode;
            this.backgroundStyle = note.stateData.backgroundStyle || this.backgroundStyle;
            if (note.stateData.canvasHeight && note.stateData.canvasHeight > this.canvasHeight) {
                this.canvasHeight = note.stateData.canvasHeight;
                this.canvas.height = this.canvasHeight;
                this.offscreenCanvas.height = this.canvasHeight;
                this.canvas.style.height = this.canvasHeight + 'px';
            }
            this.selectedIds.clear();
            this.hydrateImages();
            this.saveState();
            this.rebuildSpatialIndex();
            this.cachedOffscreenValid = false;
            this.scheduleRender();
            this.updateActiveStates();
            this.dirty = false; // Freshly loaded — not dirty yet
            if (note.stateData.mode) this.setMode(note.stateData.mode);
            this.highlightActiveNote();
            this.updateSaveState('saved');
            console.log('Loaded note:', id);
            return;
        }

        // Handle legacy image-based notes
        const imageItem = { id: this.createId(), type: 'image', imageData: note.previewImage || note.imageData, height: this.canvas.height };
        const img = new Image();
        img.onload = () => {
            imageItem.imageElement = img;
            this.items = [imageItem];
            this.saveState();
            this.rebuildSpatialIndex();
            this.cachedOffscreenValid = false;
            this.scheduleRender();
            this.highlightActiveNote();
        };
        img.src = note.previewImage || note.imageData;
    }

    async renameNote(id) {
        const note = await this.storage.getNote(id);
        if (!note) return;
        const newTitle = prompt('Rename note', note.title || '');
        if (!newTitle || !newTitle.trim()) return;
        const oldBase = note.fileBaseName;
        note.title = newTitle.trim();
        note.fileBaseName = this.slugifyFileName(note.title);
        note.updatedAt = new Date().toISOString();
        await this.storage.saveNote(note);
        await this.syncNoteToFolder(note);
        if (oldBase && oldBase !== note.fileBaseName) await this.deleteNoteFilesFromFolder(oldBase);
        // Update active note bar if this is the active note
        if (id === this.currentNoteId) {
            const activeTitle = document.getElementById('activeNoteTitle');
            if (activeTitle) activeTitle.textContent = note.title;
        }
        await this.loadNotes();
    }

    async togglePinNote(id) {
        const note = await this.storage.getNote(id);
        if (!note) return;
        note.pinned = !note.pinned;
        note.updatedAt = new Date().toISOString();
        await this.storage.saveNote(note);
        await this.syncNoteToFolder(note);
        await this.loadNotes();
    }

    /**
     * Soft-delete: marks note as deleted (moves to Trash).
     */
    async deleteNote(id) {
        if (!confirm('Move this note to Trash?')) return;
        const note = await this.storage.getNote(id);
        if (!note) return;
        note.deleted = true;
        note.deletedAt = new Date().toISOString();
        note.updatedAt = new Date().toISOString();
        await this.storage.saveNote(note);
        // If this was the active note, create a new one automatically
        if (id === this.currentNoteId) {
            this.currentNoteId = null;
            await this.createAutomaticNote();
        }
        await this.loadNotes();
    }

    /**
     * Restore a soft-deleted note from Trash.
     */
    async restoreNote(id) {
        const note = await this.storage.getNote(id);
        if (!note) return;
        note.deleted = false;
        delete note.deletedAt;
        note.updatedAt = new Date().toISOString();
        await this.storage.saveNote(note);
        await this.loadNotes();
    }

    /**
     * Permanently remove a note from IndexedDB and the file system folder.
     */
    async deleteNotePermanently(id) {
        if (!confirm('Permanently delete this note? This cannot be undone.')) return;
        const note = await this.storage.getNote(id);
        if (note && note.fileBaseName) await this.deleteNoteFilesFromFolder(note.fileBaseName);
        await this.storage.deleteNote(id);
        await this.loadNotes();
    }

    formatDate(v) { if(!v) return 'No date'; const d=new Date(v); if(Number.isNaN(d.getTime())) return String(v); return d.toLocaleString(); }

    formatDateShort(v) {
        if (!v) return '—';
        const d = new Date(v);
        if (Number.isNaN(d.getTime())) return String(v);
        const now = new Date();
        const diffMs = now - d;
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return 'just now';
        if (diffMin < 60) return `${diffMin}m ago`;
        const diffH = Math.floor(diffMin / 60);
        if (diffH < 24) return `${diffH}h ago`;
        const diffD = Math.floor(diffH / 24);
        if (diffD < 7) return `${diffD}d ago`;
        return d.toLocaleDateString();
    }

    setDefaultNoteDateTime() { const input=document.getElementById('noteDateTime'); if(!input) return; const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset()); input.value=now.toISOString().slice(0,16); }

    async syncAllNotesToFolder() {
        if (!this.notesFolderHandle) return;
        let allNotes = [];
        try { allNotes = await this.storage.getAllNotes(); } catch { return; }
        for (const note of allNotes) {
            if (!note.deleted) await this.syncNoteToFolder(note);
        }
    }

    async syncNoteToFolder(note) {
        if (!this.notesFolderHandle || !note) return;
        if (!note.fileBaseName) note.fileBaseName = this.slugifyFileName(note.title || 'Untitled');
        try {
            await this.writeTextFile(`${note.fileBaseName}.whiteboard.json`, JSON.stringify(this.noteToFileData(note), null, 2));
            if (note.previewImage || note.imageData) {
                await this.writeBlobFile(`${note.fileBaseName}.png`, this.dataUrlToBlob(note.previewImage || note.imageData));
            }
            if (this.dom.folderSyncStatus) this.dom.folderSyncStatus.textContent = `Synced: ${this.notesFolderHandle.name}`;
        } catch {
            if (this.dom.folderSyncStatus) this.dom.folderSyncStatus.textContent = 'Sync failed — choose folder again';
            this.notesFolderHandle = null;
        }
    }

    async writeTextFile(name, text) { const h=await this.notesFolderHandle.getFileHandle(name,{create:true}); const w=await h.createWritable(); await w.write(text); await w.close(); }
    async writeBlobFile(name, blob) { const h=await this.notesFolderHandle.getFileHandle(name,{create:true}); const w=await h.createWritable(); await w.write(blob); await w.close(); }
    async deleteNoteFilesFromFolder(base) { if (!this.notesFolderHandle||!base) return; for (const ext of ['.whiteboard.json','.png']) try { await this.notesFolderHandle.removeEntry(`${base}${ext}`); } catch {} }

    noteToFileData(note) { return { id:note.id, title:note.title, pinned:!!note.pinned, createdAt:note.createdAt, updatedAt:note.updatedAt, noteDate:note.noteDate, stateData:note.stateData, imageFile:`${note.fileBaseName}.png` }; }

    dataUrlToBlob(dataUrl) {
        const [header, data] = dataUrl.split(',');
        const mime = header.match(/:(.*?);/)[1];
        const binary = atob(data); const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
    }

    slugifyFileName(v) { return (v||'').trim().replace(/[<>:"/\\|?*\x00-\x1F]/g,'').replace(/\s+/g,' ').slice(0,80)||'Untitled'; }

    hydrateImages() {
        this.items.forEach(item => {
            if (item.type!=='image'||!item.imageData) return;
            const img=new Image();
            img.onload=()=>{ item.imageElement=img; this.cachedOffscreenValid=false; this.scheduleRender(); };
            img.src=item.imageData;
        });
    }

} // end class OptimizedWhiteboard

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EZ-Board</title>
    <style>
        :root {
            --brand:       #7c6ff7;
            --brand-dark:  #5b52d6;
            --brand-glow:  rgba(124,111,247,0.18);
            --surface:     #ffffff;
            --surface2:    #f6f6fb;
            --border:      #e4e4ef;
            --text:        #1a1a2e;
            --text-muted:  #7a7a9a;
            --accent-red:  #ef4444;
            --accent-blue: #3b82f6;
            --accent-grn:  #22c55e;
            --accent-org:  #f97316;
            --toolbar-h:   52px;
            --radius:      8px;
            --shadow-sm:   0 1px 4px rgba(0,0,0,.08);
            --shadow-md:   0 4px 16px rgba(0,0,0,.12);
            --shadow-lg:   0 8px 32px rgba(0,0,0,.18);
            --transition:  0.14s ease;
        }

        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--surface2);
            overflow: hidden;
            color: var(--text);
        }

        /* ─── TOOLBAR ─── */
        .toolbar {
            height: var(--toolbar-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 4px;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 200;
        }

        .toolbar-left  { display:flex; align-items:center; gap:4px; flex:1; min-width:0; overflow:hidden; }
        .toolbar-right { display:flex; align-items:center; gap:4px; flex-shrink:0; }

        /* Brand mark */
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 10px 0 4px;
            margin-right: 4px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .brand-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            border-radius: 7px;
            display: flex; align-items:center; justify-content:center;
            font-size: 15px;
            box-shadow: 0 2px 8px var(--brand-glow);
        }
        .brand-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -.3px;
            background: linear-gradient(120deg, var(--brand), var(--brand-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Divider */
        .tbr-div {
            width: 1px;
            height: 24px;
            background: var(--border);
            flex-shrink: 0;
            margin: 0 2px;
        }

        /* Base button */
        .tbr-btn {
            height: 34px;
            padding: 0 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            display: flex; align-items:center; gap:5px;
            transition: all var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tbr-btn:hover { background: var(--surface2); border-color: #c4c4da; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .tbr-btn.active {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
            box-shadow: 0 2px 10px var(--brand-glow);
        }
        .tbr-btn.active:hover { background: var(--brand-dark); border-color: var(--brand-dark); }

        /* Icon-only button */
        .tbr-icon {
            width: 34px; height: 34px; padding: 0;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius);
            cursor: pointer;
            display: flex; align-items:center; justify-content:center;
            font-size: 15px;
            transition: all var(--transition);
            flex-shrink: 0;
            color: var(--text);
        }
        .tbr-icon:hover { background: var(--surface2); border-color: #c4c4da; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .tbr-icon.active { background: var(--brand); border-color: var(--brand); box-shadow: 0 2px 10px var(--brand-glow); }

        /* Danger button */
        .tbr-btn.danger:hover { background: #fff1f1; border-color: var(--accent-red); color: var(--accent-red); }

        /* Selection action bar — appears inline */
        .selection-actions { display:none; align-items:center; gap:4px; }
        .selection-actions.visible { display:flex; }

        /* Quick pens strip */
        .quick-pens { display:flex; gap:3px; align-items:center; }
        .favorite-pen {
            width: 28px; height: 28px; padding: 0;
            border: 1.5px solid var(--border);
            background: var(--surface);
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .favorite-pen:hover { border-color: var(--brand); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .favorite-pen::after {
            content: '';
            position: absolute;
            left:50%; top:50%;
            width: var(--dot-size, 9px);
            height: var(--dot-size, 9px);
            background: var(--pen-color, #000);
            border-radius: 999px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 1px rgba(0,0,0,.12);
        }

        /* Custom cursors for canvas tools - light mode */
        canvas.pen-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="2,22 6,21 20,7 18,5 4,19" fill="%231a1a2e" stroke="%23ffffff" stroke-width="1.5"/><line x1="18" y1="5" x2="20" y2="7" stroke="%231a1a2e" stroke-width="2"/><circle cx="16" cy="8" r="1.5" fill="%23ffffff"/></svg>') 2 22, crosshair;
        }
        
        /* Dark mode pen cursor - inverted colors */
        body.dark-mode canvas.pen-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="2,22 6,21 20,7 18,5 4,19" fill="%23e8e8f8" stroke="%231a1a2e" stroke-width="1.5"/><line x1="18" y1="5" x2="20" y2="7" stroke="%23e8e8f8" stroke-width="2"/><circle cx="16" cy="8" r="1.5" fill="%231a1a2e"/></svg>') 2 22, crosshair;
        }
        
        /* Eraser cursor - light mode */
        canvas.eraser-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="14" width="16" height="4" fill="%231a1a2e" stroke="%23ffffff" stroke-width="1.5" transform="rotate(-45 12 16)"/><circle cx="12" cy="12" r="8" fill="none" stroke="%231a1a2e" stroke-width="2"/></svg>') 12 12, cell;
        }
        
        /* Dark mode eraser cursor - inverted colors */
        body.dark-mode canvas.eraser-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="14" width="16" height="4" fill="%23e8e8f8" stroke="%231a1a2e" stroke-width="1.5" transform="rotate(-45 12 16)"/><circle cx="12" cy="12" r="8" fill="none" stroke="%23e8e8f8" stroke-width="2"/></svg>') 12 12, cell;
        }
        
        canvas.lasso-cursor {
            cursor: crosshair;
        }

        /* Zoom display */
        .zoom-display {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            min-width: 38px;
            text-align: center;
        }

        /* ─── FLOATING MENUS ─── */
        .floating-menu {
            position: fixed;
            z-index: 1000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
            animation: menuIn .12s ease;
        }
        .floating-menu.open { display:flex; }

        @keyframes menuIn {
            from { opacity:0; transform:translateY(-6px) scale(.97); }
            to   { opacity:1; transform:translateY(0)   scale(1);    }
        }

        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-label {
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
            padding: 2px 2px 0;
        }
        .menu-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-btn {
            flex: 1;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            display: flex; align-items:center; justify-content:center; gap:5px;
            transition: all var(--transition);
        }
        .menu-btn:hover { background: var(--surface2); border-color: #c4c4da; }
        .menu-btn.active { background: var(--brand); color:#fff; border-color:var(--brand); box-shadow: 0 2px 8px var(--brand-glow); }

        .menu-slider-row {
            display:flex; align-items:center; gap:8px;
        }
        .menu-slider-row input[type=range] {
            flex:1; accent-color: var(--brand);
        }
        .menu-slider-val {
            font-size: 11px; font-weight: 600;
            color: var(--text-muted);
            min-width: 28px; text-align:right;
        }
        .menu-color-row {
            display:flex; align-items:center; gap:8px;
        }
        .menu-color-row input[type=color] {
            width:36px; height:30px;
            border:1px solid var(--border); border-radius:6px; cursor:pointer;
            flex-shrink:0;
        }
        .menu-color-label { font-size:12px; color:var(--text-muted); flex:1; }
        .menu-divider { height:1px; background:var(--border); margin:2px 0; }

        /* Pen menu wider */
        #penMenu { min-width: 240px; }

        /* ─── SIDEBAR ─── */
        .notes-sidebar {
            position: fixed;
            right: 0; top: var(--toolbar-h); bottom: 0;
            width: 300px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            gap: 12px;
            overflow-y: auto;
            z-index: 150;
            box-shadow: var(--shadow-md);
            transition: transform .25s cubic-bezier(.4,0,.2,1);
        }
        .notes-sidebar.hidden { transform: translateX(100%); }

        .notes-header {
            display: flex; align-items:center; justify-content:space-between;
            font-weight: 700; font-size: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--brand);
            color: var(--text);
        }
        .notes-header-close {
            width:26px; height:26px; border:none; background:none;
            cursor:pointer; border-radius:6px; font-size:16px;
            display:flex; align-items:center; justify-content:center;
            color:var(--text-muted); transition:all var(--transition);
        }
        .notes-header-close:hover { background:var(--surface2); color:var(--text); }

        .note-input-area { display:flex; flex-direction:column; gap:7px; }
        .note-input-area input {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 12.5px;
            color: var(--text);
            background: var(--surface);
            transition: border-color var(--transition);
            user-select: text;
        }
        .note-input-area input:focus { outline:none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-glow); }

        .note-input-area .sbr-btn {
            padding: 8px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            transition: all var(--transition);
        }
        .note-input-area .sbr-btn:hover { background:var(--surface2); }
        .note-input-area .sbr-btn.primary {
            background: var(--brand);
            color: #fff;
            border-color: var(--brand);
        }
        .note-input-area .sbr-btn.primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }

        .folder-status {
            font-size: 11px; color: var(--text-muted);
            padding: 2px 2px;
        }

        .notes-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:7px; }

        .note-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px 11px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .note-item:hover { border-color: var(--brand); background:#fff; box-shadow: 0 2px 10px var(--brand-glow); transform: translateY(-1px); }
        .note-item.active-note {
            border: 2px solid var(--brand);
            background: rgba(124, 111, 247, 0.12);
            box-shadow: 0 0 12px rgba(124, 111, 247, 0.25);
        }
        .note-title { font-weight: 600; font-size: 13px; margin-bottom:4px; color:var(--text); }
        .note-meta { display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-muted); margin-top:3px; }
        .note-actions { display:flex; gap:4px; margin-top:8px; }
        .note-actions button {
            flex:1; padding:4px; font-size:11px;
            background:var(--surface); border:1px solid var(--border);
            border-radius:5px; cursor:pointer; color:var(--text);
            transition:all var(--transition);
        }
        .note-actions button:hover { background:var(--surface2); border-color:#c4c4da; }
        .note-actions button.del:hover { background:#fff1f1; border-color:var(--accent-red); color:var(--accent-red); }
        .pin-label { color:var(--brand); font-weight:700; font-size:10px; }

        /* ─── MAIN CONTAINER ─── */
        .main-container {
            position: absolute;
            top: var(--toolbar-h);
            left: 0; right: 0; bottom: 0;
            overflow: auto;
            /* CRITICAL: Disable browser touch handling so stylus/finger pointer
               events are delivered to the canvas uninterrupted. Scroll is handled
               via JS (wheel + keyboard) so this does NOT break scrolling. */
            touch-action: none;
        }

        canvas {
            display: block;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="black" d="M3.5 3.5L14.5 14.5L14 15L3.5 4.5Z" stroke="black" stroke-width="1"/><path fill="black" d="M15.5 15.5L20 20L19.5 20.5L15 16Z" stroke="black" stroke-width="1"/><circle cx="13" cy="13" r="2" fill="black"/></svg>') 0 0, crosshair;
            touch-action: none;
            will-change: transform;
        }

        /* ─── STATUS BAR (bottom-left) ─── */
        .status-bar {
            position: fixed;
            bottom: 10px; left: 12px;
            display: flex; align-items:center; gap:8px;
            z-index: 300;
            pointer-events: none;
        }
        .status-pill {
            background: rgba(26,26,46,.72);
            backdrop-filter: blur(8px);
            color: #e0e0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .2px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .status-pill.saved { color: #6ee7b7; }

        /* ─── OVERLAY backdrop for menus ─── */
        .menu-backdrop {
            position: fixed; inset:0; z-index:999;
            display:none;
        }
        .menu-backdrop.open { display:block; }

        /* ─── COLOR SWATCHES in pen menu ─── */
        .color-swatches {
            display:grid; grid-template-columns: repeat(8,1fr); gap:4px;
        }
        .color-swatch {
            width:100%; aspect-ratio:1;
            border-radius:5px; border:2px solid transparent;
            cursor:pointer; transition:all var(--transition);
        }
        .color-swatch:hover { transform:scale(1.15); border-color:var(--text); }
        .color-swatch.active { border-color:var(--brand); box-shadow:0 0 0 2px var(--brand-glow); }

        /* ─── FOLDER STRIP ─── */
        .folder-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .folder-status {
            flex: 1;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
        }
        .folder-status.connected { color: var(--accent-grn); font-weight: 600; }
        .folder-connect-btn {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--brand);
            background: var(--brand-glow);
            color: var(--brand);
            cursor: pointer;
            font-size: 11.5px;
            font-weight: 600;
            white-space: nowrap;
            transition: all var(--transition);
        }
        .folder-connect-btn:hover { background: var(--brand); color: #fff; }
        .folder-connect-btn.connected {
            border-color: var(--accent-grn);
            background: rgba(34,197,94,.1);
            color: var(--accent-grn);
        }
        .folder-connect-btn.connected:hover { background: var(--accent-grn); color: #fff; }

        /* ─── ACTIVE NOTE BAR ─── */
        .active-note-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            background: linear-gradient(90deg, var(--brand-glow), transparent);
            border: 1px solid var(--brand);
            border-radius: 8px;
        }
        .active-note-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .active-note-title { font-size: 12px; font-weight: 600; color: var(--brand); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .active-note-new {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--brand);
            background: var(--surface);
            color: var(--brand);
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition);
            flex-shrink: 0;
        }
        .active-note-new:hover { background: var(--brand); color: #fff; }

        /* scrollbar styling */
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d0d0e8; border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand); }

        /* Grouped Toolbar style */
        .tbr-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2px 4px;
            margin-right: 2px;
            height: 38px;
            flex-shrink: 0;
        }
        .tbr-group .tbr-btn, .tbr-group .tbr-icon {
            border: none !important;
            background: transparent !important;
            height: 32px !important;
            box-shadow: none !important;
        }
        .tbr-group .tbr-btn:hover, .tbr-group .tbr-icon:hover {
            background: var(--surface) !important;
            border-radius: calc(var(--radius) - 2px) !important;
        }
        .tbr-group .tbr-btn.active, .tbr-group .tbr-icon.active {
            background: var(--brand) !important;
            color: #fff !important;
            border-radius: calc(var(--radius) - 2px) !important;
        }

        /* Notes sidebar search & filter */
        .sidebar-search-filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
        }
        .sidebar-search {
            position: relative;
        }
        .sidebar-search input {
            width: 100%;
            padding: 7px 10px 7px 28px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 12.5px;
            color: var(--text);
            background: var(--surface);
            user-select: text;
        }
        .sidebar-search input:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }
        .sidebar-search::before {
            content: "🔍";
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .sidebar-filter-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .sidebar-filter-row select {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11.5px;
            background: var(--surface);
            color: var(--text);
            outline: none;
        }
        .sidebar-filter-row select:focus {
            border-color: var(--brand);
        }
        .sidebar-filter-btn {
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: all var(--transition);
        }
        .sidebar-filter-btn:hover {
            background: var(--surface2);
        }
        .sidebar-filter-btn.active {
            background: var(--brand-glow);
            color: var(--brand);
            border-color: var(--brand);
        }
        
        .sidebar-tab-row {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }
        .sidebar-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
        }
        .sidebar-tab:hover {
            color: var(--text);
        }
        .sidebar-tab.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
        }

        /* Group section headers in note list */
        .note-group-header {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-muted);
            padding: 8px 4px 4px;
            border-bottom: 1px solid var(--border);
            margin-top: 8px;
            margin-bottom: 4px;
        }

        /* Save Status pulse animation */
        @keyframes savePulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
            100% { transform: scale(1); opacity: 1; }
        }
        .status-pill.saving-active {
            animation: savePulse 1s infinite ease-in-out;
            color: #f97316;
            background: rgba(249, 115, 22, 0.15);

<script>
/* ═══════════════════════════════════════════════════════════
   PALETTE for color swatches
═══════════════════════════════════════════════════════════ */
const PALETTE = [
    '#111827','#6b7280','#ffffff','#ef4444',
    '#f97316','#eab308','#22c55e','#3b82f6',
    '#7c6ff7','#ec4899','#06b6d4','#14b8a6',
    '#84cc16','#a855f7','#f43f5e','#0ea5e9',
];

/* ═══════════════════════════════════════════════════════════
   INDEXEDDB STORAGE MANAGER (Reliability Layer)
═══════════════════════════════════════════════════════════ */
class StorageManager {
    constructor() {
        this.dbName = 'EZBoardDB';
        this.dbVersion = 1;
        this.db = null;
        this.initDB();
    }

    async initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.dbVersion);
            
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                this.db = request.result;
                resolve();
            };
            
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                
                // Notes store
                if (!db.objectStoreNames.contains('notes')) {
                    const noteStore = db.createObjectStore('notes', { keyPath: 'id' });
                    noteStore.createIndex('updatedAt', 'updatedAt', { unique: false });
                    noteStore.createIndex('pinned', 'pinned', { unique: false });
                }
                
                // Snapshots store (version history)
                if (!db.objectStoreNames.contains('snapshots')) {
                    const snapshotStore = db.createObjectStore('snapshots', { keyPath: 'id' });
                    snapshotStore.createIndex('noteId', 'noteId', { unique: false });
                    snapshotStore.createIndex('timestamp', 'timestamp', { unique: false });
                }
                
                // Session tracking
                if (!db.objectStoreNames.contains('session')) {
                    db.createObjectStore('session', { keyPath: 'key' });
                }
            };
        });
    }

    async migrateLegacyNotes() {
        try {
            const legacyRaw = localStorage.getItem('whiteboard_notes');
            if (!legacyRaw) return;
            const legacyNotes = JSON.parse(legacyRaw);
            if (!Array.isArray(legacyNotes) || legacyNotes.length === 0) return;

            console.log(`Migrating ${legacyNotes.length} legacy notes from localStorage to IndexedDB...`);
            for (const note of legacyNotes) {
                if (!note.id) note.id = Date.now() + Math.floor(Math.random() * 1000);
                if (!note.createdAt) note.createdAt = new Date().toISOString();
                if (!note.updatedAt) note.updatedAt = new Date().toISOString();
                if (!note.stateData) {
                    note.stateData = {
                        items: [],
                        mode: 'light',
                        backgroundStyle: 'clean',
                        canvasHeight: 1600
                    };
                }
                note.deleted = false;
                await this.saveNote(note);
            }
            localStorage.removeItem('whiteboard_notes');
            console.log('Legacy notes migration completed successfully!');
        } catch(e) {
            console.error('Failed to migrate legacy notes:', e);
        }
    }

    async saveNote(note) {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['notes'], 'readwrite');
            const store = transaction.objectStore('notes');
            const request = store.put(note);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    async getNote(id) {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['notes'], 'readonly');
            const store = transaction.objectStore('notes');
            const request = store.get(id);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async getAllNotes() {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['notes'], 'readonly');
            const store = transaction.objectStore('notes');
            const index = store.index('updatedAt');
            const request = index.getAll();
            request.onsuccess = () => resolve(request.result.sort((a,b) => 
                new Date(b.updatedAt) - new Date(a.updatedAt)
            ));
            request.onerror = () => reject(request.error);
        });
    }

    async deleteNote(id) {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['notes', 'snapshots'], 'readwrite');
            
            // Delete note
            const noteStore = transaction.objectStore('notes');
            noteStore.delete(id);
            
            // Delete associated snapshots
            const snapshotStore = transaction.objectStore('snapshots');
            const index = snapshotStore.index('noteId');
            const request = index.openCursor(IDBKeyRange.only(id));
            
            request.onsuccess = (event) => {
                const cursor = event.target.result;
                if (cursor) {
                    cursor.delete();
                    cursor.continue();
                }
            };
            
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
        });
    }

    async saveSnapshot(noteId, stateData) {
        if (!this.db) await this.initDB();
        
        // Get existing snapshots for this note
        const snapshots = await this.getSnapshots(noteId);
        
        // Create new snapshot
        const snapshot = {
            id: `${noteId}_${Date.now()}`,
            noteId: noteId,
            stateData: JSON.parse(JSON.stringify(stateData)),
            timestamp: Date.now()
        };
        
        // Keep only last 5 snapshots
        const toDelete = snapshots.slice(4);
        
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['snapshots'], 'readwrite');
            const store = transaction.objectStore('snapshots');
            
            // Add new snapshot
            store.put(snapshot);
            
            // Delete old snapshots
            toDelete.forEach(s => {
                store.delete(s.id);
            });
            
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
        });
    }

    async getSnapshots(noteId) {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['snapshots'], 'readonly');
            const store = transaction.objectStore('snapshots');
            const index = store.index('noteId');
            const request = index.getAll(IDBKeyRange.only(noteId));
            
            request.onsuccess = () => {
                const snapshots = request.result.sort((a,b) => b.timestamp - a.timestamp);
                resolve(snapshots);
            };
            request.onerror = () => reject(request.error);
        });
    }

    async restoreSnapshot(snapshotId) {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['snapshots'], 'readonly');
            const store = transaction.objectStore('snapshots');
            const request = store.get(snapshotId);
            
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async setSessionOpen(value) {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['session'], 'readwrite');
            const store = transaction.objectStore('session');
            const request = store.put({ key: 'session_open', value: value });
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    async getSessionOpen() {
        if (!this.db) await this.initDB();
        return new Promise((resolve, reject) => {
            const transaction = this.db.transaction(['session'], 'readonly');
            const store = transaction.objectStore('session');
            const request = store.get('session_open');
            request.onsuccess = () => resolve(request.result ? request.result.value : false);
            request.onerror = () => reject(request.error);
        });
    }

    async healthCheck() {
        try {
            if (!this.db) await this.initDB();
            // Test write/read
            const testKey = 'health_test_' + Date.now();
            const testStore = this.db.transaction(['session'], 'readwrite').objectStore('session');
            await new Promise((resolve, reject) => {
                const request = testStore.put({ key: testKey, value: 'ok' });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
            await new Promise((resolve, reject) => {
                const request = this.db.transaction(['session'], 'readwrite').objectStore('session').delete(testKey);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
            return true;
        } catch(e) {
            console.error('IndexedDB health check failed:', e);
            return false;
        }
    }
}

/* ═══════════════════════════════════════════════════════════
   OPTIMIZED WHITEBOARD CLASS (all original methods preserved)
═══════════════════════════════════════════════════════════ */
class OptimizedWhiteboard {
    constructor() {
        console.log('Constructor started');
        this.canvas = document.getElementById('whiteboard');
        if (!this.canvas) console.error('Canvas not found!');
        this.ctx = this.canvas.getContext('2d');
        this.offscreenCanvas = document.createElement('canvas');
        this.offscreenCtx = this.offscreenCanvas.getContext('2d');
        this.container = document.getElementById('canvasContainer');
        this.storage = new StorageManager(); // IndexedDB storage
        this.items = [];
        this.history = [];
        this.historyIndex = -1;
        this.clipboardItems = [];
        this.selectedIds = new Set();
        this.isDrawing = false;
        this.currentTool = 'pen';
        this.currentColor = '#111827';
        this.brushSize = 3;
        this.eraserSize = 18;
        this.eraserMode = 'area';
        this.mode = 'light';
        this.backgroundStyle = 'clean';
        this.canvasHeight = 0;
        this.currentStroke = null;
        this.currentLasso = null;
        this.recoveryBuffer = null; // For crash recovery
        this.saveStatus = 'saved'; // saved, saving, error, editing
        this.lastSaveTime = Date.now();
        this.recoveryInterval = null;
        this.strokeCount = 0; // For snapshot frequency
        this.lastHeartbeat = Date.now(); // For crash detection
        this.heartbeatInterval = null;
        this.erasedDuringStroke = false;
        this.dirty = false;
        this.notesFolderHandle = null;
        this.favoritePens = this.loadFavoritePens();
        this.renderScheduled = false;
        this.viewportTop = 0;
        this.viewportBottom = 0;
        this.cachedOffscreenValid = false;
        this.spatialIndex = new Map();
        this.gridSize = 100;
        // Zoom
        this.zoom = 1;
        // Auto-save flags
        this._isSaving = false;
        this._saveTimeout = null;
        this.currentNoteId = null;
        
        // Notes filter parameters
        this.notesTab = 'active'; // 'active' or 'trash'
        this.notesSearchQuery = '';
        this.notesSortBy = 'date-desc';
        this.notesPinnedOnly = false;
        
        console.log('Constructor finished, calling init...');
        this.init();
        console.log('Init done');
        // Temporarily disable notes folder to prevent freeze
        // this.initPermanentNotesFolder();
        console.log('All done');
    }

    async initializeActiveNote() {
        try {
            // First, migrate any legacy notes from localStorage whiteboard_notes to IndexedDB
            await this.storage.migrateLegacyNotes();

            // Get last active note ID from localStorage (just the ID, not the note)
            const lastActiveId = localStorage.getItem('lastActiveNoteId');
            let allNotes = await this.storage.getAllNotes();
            let activeNotes = allNotes.filter(n => !n.deleted);
            
            if (activeNotes.length === 0) {
                await this.createAutomaticNote();
            } else if (lastActiveId && activeNotes.find(n => n.id == lastActiveId)) {
                // Restore the exact note user was last editing
                this.currentNoteId = parseInt(lastActiveId);
                await this.loadNote(this.currentNoteId);
            } else {
                // Fallback to most recent active note
                this.currentNoteId = activeNotes[0].id;
                await this.loadNote(this.currentNoteId);
            }
            console.log("Loaded note:", this.currentNoteId);
        } catch(e) {
            console.error('Failed to initialize active note:', e);
        }
    }

    async createAutomaticNote() {
        const now = new Date();
        const title = now.toLocaleString();
        
        const note = {
            id: Date.now(),
            title: title,
            pinned: false,
            deleted: false,
            createdAt: now.toISOString(),
            updatedAt: now.toISOString(),
            stateData: {
                items: [],
                mode: this.mode,
                backgroundStyle: this.backgroundStyle,
                canvasHeight: this.canvasHeight
            }
        };
        
        await this.storage.saveNote(note);
        this.currentNoteId = note.id;
        localStorage.setItem('lastActiveNoteId', this.currentNoteId.toString());
    }

    async saveCurrentNote() {
        if (!this.currentNoteId) return;
        
        try {
            this.updateSaveState('saving');
            const note = await this.storage.getNote(this.currentNoteId);
            if (!note) return;
            
            note.updatedAt = new Date().toISOString();
            note.stateData = {
                items: this.items.map(i => this.serializeItem(i)),
                mode: this.mode,
                backgroundStyle: this.backgroundStyle,
                canvasHeight: this.canvasHeight
            };
            
            // Generate preview lazily (only if 10 seconds have passed since last edit)
            if (Date.now() - this.lastSaveTime > 10000) {
                note.previewImage = this.canvas.toDataURL('image/jpeg', 0.3); // Compressed preview
                this.lastSaveTime = Date.now();
            }
            
            await this.storage.saveNote(note);
            // Also sync to file system if permanent notes folder is connected
            await this.syncNoteToFolder(note);

            localStorage.setItem('lastActiveNoteId', this.currentNoteId.toString());
            this.updateSaveState('saved');
            this.dirty = false;
        } catch(e) {
            console.error('Failed to save note:', e);
            this.updateSaveState('error');
            this.triggerEmergencyBackup();
        }
    }

    triggerEmergencyBackup() {
        try {
            const backupData = {
                noteId: this.currentNoteId,
                items: this.items.map(i => this.serializeItem(i)),
                mode: this.mode,
                backgroundStyle: this.backgroundStyle,
                canvasHeight: this.canvasHeight,
                timestamp: Date.now()
            };
            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `emergency_backup_${this.currentNoteId || 'new'}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log('Emergency backup downloaded');
        } catch(err) {
            console.error('Emergency backup failed:', err);
        }
    }

            penMenu:           document.getElementById('penMenu'),

            notesSidebar:      document.getElementById('notesSidebar'),

            folderStrip:       document.getElementById('folderStrip'),
            folderConnectBtn:  document.getElementById('chooseNotesFolderBtn'),
            activeNoteBar:     document.getElementById('activeNoteBar'),
            activeNoteTitle:   document.getElementById('activeNoteTitle'),
            newNoteBtn:        document.getElementById('newNoteBtn'),
            zoomDisplay:       document.getElementById('zoomDisplay'),
            zoomInBtn:         document.getElementById('zoomInBtn'),
            zoomOutBtn:        document.getElementById('zoomOutBtn'),
            perfBadge:         document.getElementById('perfBadge'),
        };

        // Safely load tool config after DOM is ready
        try {
            this.loadToolConfig();
        } catch(e) {
            console.warn('Tool config load failed:', e);
        }
        
        this.buildColorSwatches();
        this.resizeCanvas();
        this.setupEventListeners();
        this.renderFavoritePens();
        
        // Initialize async systems (wrap in IIFE to avoid blocking)
        (async () => {
            try {
                // Health check IndexedDB
                const isHealthy = await this.storage.healthCheck();
                if (!isHealthy) {
                    console.warn('IndexedDB unhealthy, offering recovery');
                    if (confirm('Storage error detected. Would you like to reset the database and recover your work?')) {
                        // Clear and reload
                        localStorage.clear();
                        location.reload();
                        return;
                    }
                }
                
                // Initialize active note system (critical for reliable operation)
                await this.initializeActiveNote();
                
                // Crash detection and recovery
                await this.checkForCrash();
                
                this.saveState();
                this.setDefaultNoteDateTime();
                this.restoreNotesFolderHandle();
                this.scheduleRender();
                this.startRecoveryBuffer(); // Start recovery buffer (2-second saves during drawing)
                this.updateViewport();
                
                // Update status display
                this.updateSaveState('saved');
                console.log('EZ-Board fully initialized and ready');
            } catch(e) {
                console.error('Initialization error:', e);
                // Fallback - create empty note if everything fails
                if (!this.currentNoteId) {
                    this.createAutomaticNote().then(() => {
                        this.scheduleRender();
                    });
                }
            }
        })();
        
        // Auto-save every 15 MINUTES only (not every stroke — user can manually save)
        setInterval(() => {
            if (this.dirty) {
                this.saveState();
                this.saveCurrentNote().then(() => {
                    console.log('Auto-saved (15 min)');
                });
            }
        }, 15 * 60 * 1000);
        
        // Emergency save when tab becomes hidden or is closed
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && this.dirty) {
                this.saveState();
                this.saveCurrentNote();
            }
        });
        
        window.addEventListener('beforeunload', () => {
            if (this.dirty) {
                this.saveState();
                this.saveCurrentNote();
            }
            localStorage.setItem('session_closing', 'true');
        });
        window.addEventListener('pagehide', () => {
            if (this.dirty) {
                this.saveState();
                this.saveCurrentNote();
            }
            localStorage.setItem('session_closing', 'true');
        });
    }

    /* ── CRASH DETECTION ── */
    startHeartbeat() {
        // Update heartbeat every 15 seconds
        this.heartbeatInterval = setInterval(() => {
            this.lastHeartbeat = Date.now();
            localStorage.setItem('lastHeartbeat', this.lastHeartbeat.toString());
        }, 15000);
    }
    
    async checkForCrash() {
        try {
            const wasOpen = await this.storage.getSessionOpen();
            const wasClosing = localStorage.getItem('session_closing') === 'true';
            const lastHeartbeat = parseInt(localStorage.getItem('lastHeartbeat') || '0');
            const now = Date.now();
            const crashed = wasOpen && !wasClosing && (now - lastHeartbeat > 60000); // No heartbeat for 60 seconds
            
            if (crashed) {
                console.log('Previous session crashed (no heartbeat). Attempting recovery...');
                const hasRecoveryData = localStorage.getItem('recovery_buffer');
                if (hasRecoveryData) {
                    this.showRecoveryBanner();
                }
            }
            
            // Set session as open for next time
            await this.storage.setSessionOpen(true);
            // Clear closing flag
            localStorage.removeItem('session_closing');
            // Start heartbeat
            this.startHeartbeat();
        } catch(e) {
            console.warn('Crash detection failed:', e);
            this.startHeartbeat();
        }
    }

    showRecoveryBanner() {
        const banner = document.getElementById('recoveryBanner');
        if (banner) {
            banner.style.display = 'flex';
        }
    }

    /* ── SNAPSHOT SYSTEM ── */
    async createSnapshot() {
        if (!this.currentNoteId || this.items.length === 0) return;
        
        try {
            const stateData = {
                items: this.items.map(i => this.serializeItem(i)),
                mode: this.mode,
                backgroundStyle: this.backgroundStyle,
                canvasHeight: this.canvasHeight
            };
            await this.storage.saveSnapshot(this.currentNoteId, stateData);
            console.log('Snapshot created for note:', this.currentNoteId);
        } catch(e) {
            console.warn('Snapshot failed:', e);
        }
    }

    /* ── CLEAN EXIT ── */
    async cleanExit() {
        try {
            await this.storage.setSessionOpen(false);
            localStorage.removeItem('recovery_buffer');
        } catch(e) {
            console.warn('Clean exit failed:', e);
        }
    }

    /* ── VERSION HISTORY ── */
    async showVersionHistory() {
        if (!this.currentNoteId) {
            alert('No active note to show history for');
            return;
        }
        
        try {
            const snapshots = await this.storage.getSnapshots(this.currentNoteId);
            const menu = document.getElementById('versionHistoryMenu');
            const listDiv = document.getElementById('snapshotList');
            
            if (snapshots.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted);">No snapshots available</div>';
            } else {
                listDiv.innerHTML = snapshots.map((snap, index) => {
                    const date = new Date(snap.timestamp);
                    const timeStr = date.toLocaleString();
                    const isLatest = index === 0;
                    return `
                        <div style="padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2);">
                            <div style="font-weight: 600; margin-bottom: 5px;">${isLatest ? '📌 Current' : `📸 Snapshot ${snapshots.length - index}`}</div>
                            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">${timeStr}</div>
                            <button onclick="whiteboard.restoreSnapshot('${snap.id}')" style="width: 100%; padding: 6px; background: var(--brand); color: white; border: none; border-radius: 4px; cursor: pointer;">Restore This Version</button>
                        </div>
                    `;
                }).join('');
            }
            
            this.openMenu(menu, document.getElementById('versionHistoryBtn'));
        } catch(e) {
            console.error('Failed to load version history:', e);
            alert('Failed to load version history');
        }
    }
    
    async restoreSnapshot(snapshotId) {
        if (confirm('Restoring will replace your current work. Continue?')) {
            try {
                const snapshot = await this.storage.restoreSnapshot(snapshotId);
                if (snapshot && snapshot.stateData) {
                    // Restore all state data
                    this.items = snapshot.stateData.items;
                    this.mode = snapshot.stateData.mode || this.mode;
                    this.backgroundStyle = snapshot.stateData.backgroundStyle || this.backgroundStyle;
                    if (snapshot.stateData.canvasHeight && snapshot.stateData.canvasHeight > this.canvasHeight) {
                        this.canvasHeight = snapshot.stateData.canvasHeight;
                        this.canvas.height = this.canvasHeight;
                        this.offscreenCanvas.height = this.canvasHeight;
                        this.canvas.style.height = this.canvasHeight + 'px';
                    }
                    
                    // Clear selection and rebuild all caches
                    this.selectedIds.clear();
                    this.history = [JSON.stringify(this.items.map(i => this.serializeItem(i)))];
                    this.historyIndex = 0;
                    this.clipboardItems = [];
                    
                    // Rebuild spatial index and refresh UI
                    this.hydrateImages();
                    this.rebuildSpatialIndex();
                    this.cachedOffscreenValid = false;
                    this.scheduleRender();
                    this.updateActiveStates();
                    this.dirty = true;
                    
                    // Save restored state
                    await this.saveCurrentNote();
                    this.closeAllMenus();
                    this.updateSaveState('saved');
                    alert('Snapshot restored successfully!');
                }
            } catch(e) {
                console.error('Failed to restore snapshot:', e);
                alert('Failed to restore snapshot');
            }
        }
    }

        wrap.innerHTML = PALETTE.map(c => `
            <div class="color-swatch${c === this.currentColor ? ' active' : ''}"

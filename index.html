    // ============ DRAWING HANDLERS ============
    function handlePointerDown(e) {
        e.preventDefault();
        
        // Find the page-canvas (events may come from live-canvas which has pointer-events: none)
        const canvas = e.target.closest('.page-container')?.querySelector('.page-canvas');
        if (!canvas) return;
        
        // Set pointer capture to continue receiving events outside the canvas
        canvas.setPointerCapture(e.pointerId);
        
        const pageId = canvas.getAttribute('data-page-id');
        currentPageId = pageId;
        
        console.log("CURRENT PAGE ID", currentPageId);
        console.log("LOADED PAGE", pageManager.loadedPages.get(normalizePageId(currentPageId)));
        
        // Ensure page is rendered with live canvas
        let loaded = pageManager.loadedPages.get(normalizePageId(pageId));
        if (!loaded || !loaded.liveCtx) {
            pageManager.renderPage(pageId);
            loaded = pageManager.loadedPages.get(normalizePageId(pageId));
        }
        
        const rect = canvas.getBoundingClientRect();
        const coords = pageManager.getLocalCoordinates(canvas, rect, e.clientX, e.clientY);
        
        // Check if we're starting a selection drag (only for lasso tool)
        if (currentTool === 'lasso' && selectedStrokeIds.size > 0) {
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            const zoom = currentZoom;
            
            if (isPointInSelection(screenX, screenY, zoom)) {
                isDraggingSelection = true;
                dragStartX = coords.x;
                dragStartY = coords.y;
                
                // Store original positions of all selected strokes
                dragStartStrokePositions.clear();
                const page = pageManager.getPage(currentPageId);
                if (page) {
                    for (const strokeId of selectedStrokeIds) {
                        const stroke = page.strokes.find(s => s.id === strokeId);
                        if (stroke) {
                            dragStartStrokePositions.set(strokeId, JSON.parse(JSON.stringify(stroke.points)));
                        }
                    }
                }
                
                // Create preview stroke for dragging
                dragPreviewStroke = {
                    points: [],
                    color: currentColor,
                    size: currentSize
                };
                return;
            }
        }
        
        if (currentTool === 'lasso') {
            startLasso(e, canvas, rect);
            return;
        }
        
        if (currentTool === 'eraser') {
            if (eraserMode === 'stroke') {
                // Stroke eraser mode - will delete on click
                return;
            }
            // Point eraser handled in move
            return;
        }
        
        isDrawing = true;
        strokeSmoother.reset();
        
        const pressure = e.pressure || 0.5;
        const smoothed = strokeSmoother.smoothPoint({ x: coords.x, y: coords.y, pressure });
        
        currentStroke = {
            id: 'stroke_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            type: 'stroke',
            color: currentColor,
            size: currentSize,
            points: [{ x: smoothed.x, y: smoothed.y, pressure: smoothed.pressure }]
        };
    }
    
    function handlePointerMove(e) {
        if (!currentPageId) return;
        
        const target = document.querySelector(`.page-canvas[data-page-id="${currentPageId}"]`);
        if (!target) return;
        
        const rect = target.getBoundingClientRect();
        const coords = pageManager.getLocalCoordinates(target, rect, e.clientX, e.clientY);
        
        if (currentTool === 'lasso' && isLassoSelecting) {
            updateLasso(e, target, rect);
            return;
        }
        
        // Handle selection dragging
        if (currentTool === 'lasso' && isDraggingSelection) {
            const dx = coords.x - dragStartX;
            const dy = coords.y - dragStartY;
            
            // Render preview of dragged selection
            const loaded = pageManager.loadedPages.get(normalizePageId(currentPageId));
            if (loaded && loaded.liveCtx) {
                // Clear live overlay
                loaded.liveCtx.save();
                loaded.liveCtx.setTransform(1, 0, 0, 1, 0, 0);
                loaded.liveCtx.clearRect(0, 0, loaded.liveCanvas.width, loaded.liveCanvas.height);
                loaded.liveCtx.restore();
                
                // Draw preview of selected strokes at new position
                const page = pageManager.getPage(currentPageId);
                if (page) {
                    for (const strokeId of selectedStrokeIds) {
                        const originalPoints = dragStartStrokePositions.get(strokeId);
                        if (originalPoints) {
                            const previewStroke = {
                                points: originalPoints.map(p => ({ x: p.x + dx, y: p.y + dy, pressure: p.pressure })),
                                color: currentColor,
                                size: currentSize
                            };
                            pageManager.drawStroke(loaded.liveCtx, previewStroke);
                        }
                    }
                }
            }
            return;
        }
        
        if (currentTool === 'eraser') {
            // Only erase when stylus is touching the screen (not hovering)
            const penIsTouching = e.pressure > 0.01 || e.buttons === 1;
            if (eraserMode === 'point' && penIsTouching) {
                pageManager.erasePoint(currentPageId, coords, currentSize * 2);
            }
            return;
        }
        
        if (!isDrawing || !currentStroke) return;
        
        const pressure = e.pressure || 0.5;
        const smoothed = strokeSmoother.smoothPoint({ x: coords.x, y: coords.y, pressure });
        currentStroke.points.push({ x: smoothed.x, y: smoothed.y, pressure: smoothed.pressure });
        
        // Render incrementally on LIVE overlay canvas (not permanent canvas)
        const loaded = pageManager.loadedPages.get(normalizePageId(currentPageId));
        if (!loaded) {
            console.warn('No loaded page for', currentPageId);
            return;
        }
        
        // Ensure live canvas exists
        if (!loaded.liveCtx) {
            console.warn('No live context, forcing renderPage');
            pageManager.renderPage(currentPageId);
            const refreshed = pageManager.loadedPages.get(normalizePageId(currentPageId));
            if (refreshed && refreshed.liveCtx) {
                refreshed.liveCtx.clearRect(0, 0, PAGE_WIDTH, PAGE_HEIGHT);
                pageManager.drawStroke(refreshed.liveCtx, currentStroke);
            }
            return;
        }
        
        // Clear live overlay correctly with transform reset
        loaded.liveCtx.save();
        loaded.liveCtx.setTransform(1, 0, 0, 1, 0, 0);
        loaded.liveCtx.clearRect(0, 0, loaded.liveCanvas.width, loaded.liveCanvas.height);
        loaded.liveCtx.restore();
        
        pageManager.drawStroke(loaded.liveCtx, currentStroke);
    }
    
    function handlePointerUp(e) {
        // Release pointer capture
        const canvas = document.querySelector(`.page-canvas[data-page-id="${currentPageId}"]`);
        if (canvas) {
            canvas.releasePointerCapture(e.pointerId);
        }
        
        if (currentTool === 'lasso' && isLassoSelecting) {
            finishLasso(e);
            return;
        }
        
        if (currentTool === 'eraser' && eraserMode === 'stroke') {
            // Delete entire stroke under cursor
            const target = e.target;
            if (target.classList && target.classList.contains('page-canvas')) {
                const pageId = target.getAttribute('data-page-id');
                const rect = target.getBoundingClientRect();
                const coords = pageManager.getLocalCoordinates(target, rect, e.clientX, e.clientY);
                
                const page = pageManager.getPage(pageId);
                if (page) {
                    for (let i = page.strokes.length - 1; i >= 0; i--) {
                        const stroke = page.strokes[i];
                        for (const point of stroke.points) {
                            const dx = point.x - coords.x;
                            const dy = point.y - coords.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < currentSize * 3) {
                                pageManager.removeStroke(pageId, stroke.id);
                                break;
                            }
                        }
                    }
                }
            }
            return;
        }
        
        if (!isDrawing || !currentStroke) return;
        isDrawing = false;
        
        // Handle selection drag commit
        if (currentTool === 'lasso' && isDraggingSelection) {
            const dx = coords.x - dragStartX;
            const dy = coords.y - dragStartY;
            
            if (dx !== 0 || dy !== 0) {
                // Save to history before modifying
                pageManager.saveToHistory();
                
                // Move all selected strokes
                const page = pageManager.getPage(currentPageId);
                if (page) {
                    for (const strokeId of selectedStrokeIds) {
                        const stroke = page.strokes.find(s => s.id === strokeId);
                        if (stroke) {
                            for (const point of stroke.points) {
                                point.x += dx;
                                point.y += dy;
                            }
                        }
                    }
                    pageManager.markDirty(currentPageId);
                    pageManager.renderPage(currentPageId);
                    persistCurrentNotebook();
                }
            }
            
            // Clear drag state and preview
            isDraggingSelection = false;
            dragStartStrokePositions.clear();
            
            // Clear live overlay
            const loaded = pageManager.loadedPages.get(normalizePageId(currentPageId));
            if (loaded && loaded.liveCtx) {
                loaded.liveCtx.save();
                loaded.liveCtx.setTransform(1, 0, 0, 1, 0, 0);
                loaded.liveCtx.clearRect(0, 0, loaded.liveCanvas.width, loaded.liveCanvas.height);
                loaded.liveCtx.restore();
            }
            
            // Re-render to show final positions
            pageManager.renderPage(currentPageId);
            highlightSelection();
            return;
        }
        
        if (currentStroke.points.length > 1) {
            pageManager.saveToHistory();
            pageManager.addStroke(currentPageId, currentStroke);
            
            // Auto-persist after stroke
            persistCurrentNotebook();
            
            // Clear live overlay after committing stroke with correct transform reset
            const loaded = pageManager.loadedPages.get(normalizePageId(currentPageId));
            if (loaded && loaded.liveCtx) {
                loaded.liveCtx.save();
                loaded.liveCtx.setTransform(1, 0, 0, 1, 0, 0);
                loaded.liveCtx.clearRect(0, 0, loaded.liveCanvas.width, loaded.liveCanvas.height);
                loaded.liveCtx.restore();
            }
        }
        currentStroke = null;
        strokeSmoother.reset();
    }
    
    // ============ LASSO TOOL ============
    function startLasso(e, target, rect) {
        isLassoSelecting = true;
        const coords = pageManager.getLocalCoordinates(target, rect, e.clientX, e.clientY);
        lassoPoints = [coords];
        
        // Clear previous selection
        if (!e.shiftKey) {
            selectedStrokeIds.clear();
            pageManager.renderPage(currentPageId);
        }
    }
    
    function updateLasso(e, target, rect) {
        if (!isLassoSelecting) return;
        const coords = pageManager.getLocalCoordinates(target, rect, e.clientX, e.clientY);
        lassoPoints.push(coords);
        drawLassoPreview();
    }
    
    function drawLassoPreview() {
        const container = document.querySelector(`.page-container[data-page-id="${currentPageId}"]`);
        if (!container) return;
        
        let svg = container.querySelector('.lasso-path');
        if (!svg) {
            svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('lasso-path');
            svg.style.position = 'absolute';
            svg.style.top = '0';
            svg.style.left = '0';
            svg.style.width = '100%';
            svg.style.height = '100%';
            svg.style.pointerEvents = 'none';
            container.appendChild(svg);
        }
        
        // Use currentZoom directly for scaling
        const zoom = currentZoom;
        
        let pathData = '';
        if (lassoPoints.length > 0) {
            // Scale logical coordinates by zoom only
            const firstPoint = lassoPoints[0];
            pathData = `M ${firstPoint.x * zoom} ${firstPoint.y * zoom}`;
            for (let i = 1; i < lassoPoints.length; i++) {
                const point = lassoPoints[i];
                pathData += ` L ${point.x * zoom} ${point.y * zoom}`;
            }
        }
        
        svg.innerHTML = `<path d="${pathData}" stroke="#e94560" stroke-width="2" fill="rgba(233, 69, 96, 0.1)"/>`;
    }
    
    function finishLasso(e) {
        isLassoSelecting = false;
        
        // Remove preview
        const container = document.querySelector(`.page-container[data-page-id="${currentPageId}"]`);
        if (container) {
            const svg = container.querySelector('.lasso-path');
            if (svg) svg.remove();
        }
        
        if (lassoPoints.length < 3) return;
        
        // Find intersecting strokes
        const page = pageManager.getPage(currentPageId);
        if (page) {
            for (const stroke of page.strokes) {
                for (const point of stroke.points) {
                    if (isPointInPolygon(point, lassoPoints)) {
                        if (selectedStrokeIds.has(stroke.id)) {
                            selectedStrokeIds.delete(stroke.id);
                        } else {
                            selectedStrokeIds.add(stroke.id);
                        }
                        break;
                    }
                }
            }
        }
        
        // Highlight selection
        highlightSelection();
        lassoPoints = [];
        
        statusText.textContent = `${selectedStrokeIds.size} stroke(s) selected`;
        setTimeout(() => statusText.textContent = 'Ready', 1500);
    }
    
    function isPointInPolygon(point, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
            const xi = polygon[i].x, yi = polygon[i].y;
            const xj = polygon[j].x, yj = polygon[j].y;
            const intersect = ((yi > point.y) !== (yj > point.y)) &&
                (point.x < (xj - xi) * (point.y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }
    
    function highlightSelection() {
        const container = document.querySelector(`.page-container[data-page-id="${currentPageId}"]`);
        if (!container) return;
        
        // Remove old overlays
        const oldOverlays = container.querySelectorAll('.selection-overlay');
        oldOverlays.forEach(el => el.remove());
        
        const page = pageManager.getPage(currentPageId);
        if (!page) return;
        
        // Use currentZoom directly - no canvas scaling to avoid coordinate system mixing
        const zoom = currentZoom;
        
        for (const strokeId of selectedStrokeIds) {
            const stroke = page.strokes.find(s => s.id === strokeId);
            if (stroke && stroke.points.length > 0) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (const point of stroke.points) {
                    minX = Math.min(minX, point.x);
                    minY = Math.min(minY, point.y);
                    maxX = Math.max(maxX, point.x);
                    maxY = Math.max(maxY, point.y);
                }
                
                // Scale logical coordinates by zoom only - no DPR, no canvas.width
                const scaledLeft = minX * zoom;
                const scaledTop = minY * zoom;
                const scaledWidth = (maxX - minX) * zoom;
                const scaledHeight = (maxY - minY) * zoom;
                
                const overlay = document.createElement('div');
                overlay.className = 'selection-overlay';
                overlay.style.position = 'absolute';
                overlay.style.left = scaledLeft + 'px';
                overlay.style.top = scaledTop + 'px';
                overlay.style.width = scaledWidth + 'px';
                overlay.style.height = scaledHeight + 'px';
                overlay.style.border = '2px solid var(--accent)';
                overlay.style.background = 'rgba(233, 69, 96, 0.1)';
                overlay.style.pointerEvents = 'none';
                overlay.style.boxSizing = 'border-box';
                container.appendChild(overlay);
            }
        }
    }
    
    // Helper: Check if point is inside selection bounds
    function isPointInSelection(x, y, zoom) {
        const container = document.querySelector(`.page-container[data-page-id="${currentPageId}"]`);
        if (!container) return false;
        
        const page = pageManager.getPage(currentPageId);
        if (!page) return false;
        
        for (const strokeId of selectedStrokeIds) {
            const stroke = page.strokes.find(s => s.id === strokeId);
            if (stroke && stroke.points.length > 0) {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (const point of stroke.points) {
                    minX = Math.min(minX, point.x);
                    minY = Math.min(minY, point.y);
                    maxX = Math.max(maxX, point.x);
                    maxY = Math.max(maxY, point.y);
                }
                // Scale to screen coordinates
                const screenMinX = minX * zoom;
                const screenMinY = minY * zoom;
                const screenMaxX = maxX * zoom;
                const screenMaxY = maxY * zoom;
                
                if (x >= screenMinX && x <= screenMaxX && y >= screenMinY && y <= screenMaxY) {
                    return true;
                }
            }
        }
        return false;
    }
    
    function deleteSelection() {
        if (selectedStrokeIds.size === 0) return;
        
        const page = pageManager.getPage(currentPageId);
        if (page) {
            pageManager.saveToHistory();
            page.strokes = page.strokes.filter(s => !selectedStrokeIds.has(s.id));
            selectedStrokeIds.clear();
            pageManager.markDirty(currentPageId);
            pageManager.renderPage(currentPageId);
            
            const container = document.querySelector(`.page-container[data-page-id="${currentPageId}"]`);
            if (container) {
                const overlays = container.querySelectorAll('.selection-overlay');
                overlays.forEach(el => el.remove());
            }
            
            statusText.textContent = 'Selection deleted';
            setTimeout(() => statusText.textContent = 'Ready', 1000);
        }
    }
    
    function copySelection() {
        const page = pageManager.getPage(currentPageId);
        if (page && selectedStrokeIds.size > 0) {
            clipboard = page.strokes.filter(s => selectedStrokeIds.has(s.id));
            statusText.textContent = `Copied ${clipboard.length} stroke(s)`;
            setTimeout(() => statusText.textContent = 'Ready', 1000);
        }
    }
    
    function pasteSelection() {
        if (clipboard.length === 0) return;
        
        const page = pageManager.getPage(currentPageId);
        if (page) {
            pageManager.saveToHistory();
            for (const stroke of clipboard) {
                const newStroke = JSON.parse(JSON.stringify(stroke));
                newStroke.id = 'stroke_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                // Offset by 20px
                for (const point of newStroke.points) {
                    point.x += 20;
                    point.y += 20;
                }
                page.strokes.push(newStroke);
            }
            pageManager.markDirty(currentPageId);
            pageManager.renderPage(currentPageId);
            statusText.textContent = `Pasted ${clipboard.length} stroke(s)`;
            setTimeout(() => statusText.textContent = 'Ready', 1000);
        }
    }
    
    function selectAll() {
        const page = pageManager.getPage(currentPageId);
        if (page) {
            selectedStrokeIds.clear();
            for (const stroke of page.strokes) {
                selectedStrokeIds.add(stroke.id);
            }
            highlightSelection();
            statusText.textContent = `Selected ${selectedStrokeIds.size} strokes`;
            setTimeout(() => statusText.textContent = 'Ready', 1000);
        }
    }
    
    // ============ ZOOM ============
    let zoomTimeout = null;
    
    function handleWheel(e) {
        // Only zoom when Ctrl key is pressed
        if (!e.ctrlKey) {
            return; // Let normal scroll happen
        }
        
        e.preventDefault();
        
        // Get mouse position relative to viewport
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        // Calculate world coordinates before zoom
        const scrollLeft = viewport.scrollLeft;
        const scrollTop = viewport.scrollTop;
        const worldX = (scrollLeft + mouseX) / currentZoom;
        const worldY = (scrollTop + mouseY) / currentZoom;
        
        // Calculate new zoom level
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        let newZoom = currentZoom + delta;
        newZoom = Math.max(minZoom, Math.min(maxZoom, newZoom));
        
        if (newZoom !== currentZoom) {
            currentZoom = newZoom;
            
            // Re-render all visible pages at new zoom resolution (no CSS transform)
            const visiblePages = [];
            const startPage = Math.max(0, note.currentPageIndex - VIRTUAL_BUFFER);
            const endPage = Math.min(note.pages.length - 1, note.currentPageIndex + VIRTUAL_BUFFER);
            for (let i = startPage; i <= endPage; i++) {
                visiblePages.push(note.pages[i].id);
            }
            
            // Clear loaded pages cache to force re-render at new zoom
            for (const pageId of visiblePages) {
                const loaded = pageManager.loadedPages.get(pageId);
                if (loaded) {
                    // Keep canvas reference but force re-render
                    pageManager.renderPage(pageId);
                }
            }
            
            // Update container styles to match new zoom
            const containers = document.querySelectorAll('.page-container');
            containers.forEach(container => {
                const canvas = container.querySelector('.page-canvas');
                const liveCanvas = container.querySelector('.live-canvas');
                if (canvas) {
                    canvas.style.width = (PAGE_WIDTH * currentZoom) + 'px';
                    canvas.style.height = (PAGE_HEIGHT * currentZoom) + 'px';
                }
                if (liveCanvas) {
                    liveCanvas.style.width = (PAGE_WIDTH * currentZoom) + 'px';
                    liveCanvas.style.height = (PAGE_HEIGHT * currentZoom) + 'px';
                }
            });
            
            // Restore scroll position to keep cursor fixed
            const newScrollLeft = worldX * currentZoom - mouseX;
            const newScrollTop = worldY * currentZoom - mouseY;
            
            viewport.scrollLeft = Math.max(0, newScrollLeft);
            viewport.scrollTop = Math.max(0, newScrollTop);
            
            // Refresh selection overlays to match new zoom
            if (selectedStrokeIds.size > 0) {
                highlightSelection();
            }
            
            // Update status
            if (zoomTimeout) clearTimeout(zoomTimeout);
            statusText.textContent = `Zoom: ${Math.round(currentZoom * 100)}%`;
            zoomTimeout = setTimeout(() => {
                if (statusText.textContent.includes('Zoom')) statusText.textContent = 'Ready';
            }, 800);
        }
    }
    
    // Also update renderVisiblePages to not re-render on zoom (transform only)
    // Modified renderVisiblePages to not apply scale to individual containers
    
    // ============ KEYBOARD SHORTCUTS ============
    function handleKeyboard(e) {
        if (e.ctrlKey || e.metaKey) {
            switch (e.key) {
                case 'z':
                    e.preventDefault();
                    pageManager.undo();
                    break;
                case 'y':
                    e.preventDefault();
                    pageManager.redo();
                    break;
                case 's':
                    e.preventDefault();
                    pageManager.saveAllDirtyPages();
                    statusText.textContent = 'Manual save';
                    setTimeout(() => statusText.textContent = 'Ready', 1000);
                    break;
                case 'c':
                    e.preventDefault();
                    copySelection();
                    break;
                case 'v':
                    e.preventDefault();
                    pasteSelection();
                    break;
                case 'a':
                    e.preventDefault();
                    selectAll();
                    break;
            }
        } else if (e.key === 'Delete') {
            e.preventDefault();
            deleteSelection();
        } else if (e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            currentTool = 'pen';
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('penBtn').classList.add('active');
            statusText.textContent = 'Pen tool';
            setTimeout(() => statusText.textContent = 'Ready', 800);
        } else if (e.key === 'e' || e.key === 'E') {
            e.preventDefault();
            if (e.shiftKey) {
                eraserMode = 'stroke';
                statusText.textContent = 'Stroke eraser';
            } else {
                currentTool = 'eraser';
                eraserMode = 'point';
                document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById('eraserBtn').classList.add('active');
                statusText.textContent = 'Point eraser';
            }
            setTimeout(() => statusText.textContent = 'Ready', 800);
        } else if (e.key === 'l' || e.key === 'L') {
            e.preventDefault();
            currentTool = 'lasso';
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lassoBtn').classList.add('active');
            statusText.textContent = 'Lasso tool';
            setTimeout(() => statusText.textContent = 'Ready', 800);
        } else if (e.key === 'g' || e.key === 'G') {
            e.preventDefault();
            pageManager.toggleGrid();
        } else if (e.key === 'd' || e.key === 'D') {
            e.preventDefault();
            pageManager.toggleTheme();
        }
    }
    
    // ============ EVENT LISTENERS ============
    pagesWrapper.addEventListener('pointerdown', handlePointerDown);
    pagesWrapper.addEventListener('pointermove', handlePointerMove);
    pagesWrapper.addEventListener('pointerup', handlePointerUp);
    viewport.addEventListener('wheel', handleWheel, { passive: false });
    window.addEventListener('keydown', handleKeyboard);
    
    // Tool buttons
    document.getElementById('penBtn').addEventListener('click', () => {
        currentTool = 'pen';
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('penBtn').classList.add('active');
    });
    document.getElementById('eraserBtn').addEventListener('click', () => {
        currentTool = 'eraser';
        eraserMode = 'point';
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('eraserBtn').classList.add('active');
    });
    document.getElementById('lassoBtn').addEventListener('click', () => {
        currentTool = 'lasso';
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('lassoBtn').classList.add('active');
    });
    document.getElementById('undoBtn').addEventListener('click', () => pageManager.undo());
    document.getElementById('redoBtn').addEventListener('click', () => pageManager.redo());
    document.getElementById('newPageBtn').addEventListener('click', () => {
        pageManager.createPage();
        pageManager.renderVisiblePages();
        pageManager.refreshSidebar();
        pageManager.navigateToPage(note.pages.length - 1);
        persistCurrentNotebook();
    });
    document.getElementById('duplicatePageBtn').addEventListener('click', () => {
        const currentPage = note.pages[note.currentPageIndex];
        if (currentPage) {
            pageManager.duplicatePage(currentPage.id);
            persistCurrentNotebook();
        }
    });
    document.getElementById('deletePageBtn').addEventListener('click', () => {
        if (note.pages.length <= 1) {
            statusText.textContent = 'Cannot delete last page';
            setTimeout(() => statusText.textContent = 'Ready', 1500);
            return;
        }
        const currentPage = note.pages[note.currentPageIndex];
        if (currentPage) {
            pageManager.deletePage(currentPage.id);
            persistCurrentNotebook();
        }
    });
    document.getElementById('addPageSidebar').addEventListener('click', () => {
        pageManager.createPage();
        pageManager.renderVisiblePages();
        pageManager.refreshSidebar();
        pageManager.navigateToPage(note.pages.length - 1);
        persistCurrentNotebook();
    });
    document.getElementById('gridBtn').addEventListener('click', () => pageManager.toggleGrid());
    document.getElementById('darkModeBtn').addEventListener('click', () => pageManager.toggleTheme());
    document.getElementById('exportPdfBtn').addEventListener('click', () => pageManager.exportToPDF());
    document.getElementById('saveBtn').addEventListener('click', async () => {
        await pageManager.saveAllDirtyPages();
        persistCurrentNotebook();
        localStorage.setItem('ezboard_last_notebook', currentNotebookId);
        statusText.textContent = '✓ Notebook Saved';
        setTimeout(() => {
            if (statusText.textContent === '✓ Notebook Saved') statusText.textContent = 'Ready';
        }, 2000);
    });
    
    // ============ INITIALIZATION ============
    async function init() {
        await pageManager.initDB();
        
        // Create first page
        pageManager.createPage('grid');
        pageManager.renderVisiblePages();
        pageManager.refreshSidebar();
        pageIndicator.textContent = 'Page: 1';
        document.getElementById('penBtn').classList.add('active');
        
        // Auto-save periodically (every 5 minutes)
        setInterval(() => pageManager.saveAllDirtyPages(), 300000);
        
        // Save on page unload
        window.addEventListener('beforeunload', () => {
            pageManager.saveAllDirtyPages();
        });
        
        statusText.textContent = 'EZ-Board v2 ready';
        setTimeout(() => statusText.textContent = 'Ready', 2000);
        
        console.log('EZ-Board v2 initialized!');
    }
    
    init();
</script>
</body>

    /* ── FLOATING MENU SYSTEM ── */
    openMenu(menuEl, anchorEl) {
        // Close all first
        document.querySelectorAll('.floating-menu').forEach(m => m.classList.remove('open'));
        document.getElementById('menuBackdrop').classList.add('open');

        const rect = anchorEl.getBoundingClientRect();
        menuEl.style.left = Math.min(rect.left, window.innerWidth - menuEl.offsetWidth - 16) + 'px';
        menuEl.style.top  = (rect.bottom + 6) + 'px';
        menuEl.classList.add('open');

        // After paint, fix horizontal overflow
        requestAnimationFrame(() => {
            const mr = menuEl.getBoundingClientRect();
            if (mr.right > window.innerWidth - 8) {
                menuEl.style.left = (window.innerWidth - mr.width - 8) + 'px';
            }
        });
    }

    closeAllMenus() {
        document.querySelectorAll('.floating-menu').forEach(m => m.classList.remove('open'));
        document.getElementById('menuBackdrop').classList.remove('open');
    }

    /* ── VIEWPORT ── */
    updateViewport() {
        if (!this._cachedRect || this._rectDirty) {
            this._cachedRect = this.container.getBoundingClientRect();
            this._rectDirty = false;
        }
        this.viewportTop    = this.container.scrollTop / this.zoom;
        this.viewportBottom = (this.container.scrollTop + this._cachedRect.height) / this.zoom;
    }

    invalidateRect() { 
        this._rectDirty = true;
        this._invalidateCanvasRect();
    }

    /* ── VISIBILITY CULLING ── */
    isStrokeVisible(stroke) {
        if (!stroke.points || stroke.points.length === 0) return false;
        const margin = 200;
        const bounds = stroke._bounds || this.getStrokeBounds(stroke);
        return bounds.maxY >= this.viewportTop - margin && bounds.minY <= this.viewportBottom + margin;
    }

    /* ── SPATIAL INDEX ── */
    rebuildSpatialIndex() {
        this.spatialIndex.clear();
        this.items.forEach((item, idx) => {
            if (item.type !== 'stroke') return;
            const bounds = this.getStrokeBounds(item);
            const minGX = Math.floor(bounds.minX / this.gridSize);
            const maxGX = Math.floor(bounds.maxX / this.gridSize);
            const minGY = Math.floor(bounds.minY / this.gridSize);
            const maxGY = Math.floor(bounds.maxY / this.gridSize);
            for (let gx = minGX; gx <= maxGX; gx++) {
                for (let gy = minGY; gy <= maxGY; gy++) {
                    const key = `${gx},${gy}`;
                    if (!this.spatialIndex.has(key)) this.spatialIndex.set(key, []);
                    this.spatialIndex.get(key).push(idx);
                }
            }
        });
    }

    getStrokesNearPoint(x, y, radius) {
        const gx = Math.floor(x / this.gridSize);
        const gy = Math.floor(y / this.gridSize);
        const rg = Math.ceil(radius / this.gridSize) + 1;
        const set = new Set();
        for (let dx = -rg; dx <= rg; dx++)
            for (let dy = -rg; dy <= rg; dy++) {
                const idxs = this.spatialIndex.get(`${gx+dx},${gy+dy}`);
                if (idxs) idxs.forEach(i => set.add(i));
            }
        return Array.from(set).map(i => this.items[i]);
    }

    addStrokeToSpatialIndex(stroke, idx) {
        if (stroke.type !== 'stroke') return;
        const b = this.getStrokeBounds(stroke);
        const minGX = Math.floor(b.minX / this.gridSize), maxGX = Math.floor(b.maxX / this.gridSize);
        const minGY = Math.floor(b.minY / this.gridSize), maxGY = Math.floor(b.maxY / this.gridSize);
        for (let gx = minGX; gx <= maxGX; gx++)
            for (let gy = minGY; gy <= maxGY; gy++) {
                const key = `${gx},${gy}`;
                if (!this.spatialIndex.has(key)) this.spatialIndex.set(key, []);
                this.spatialIndex.get(key).push(idx);
            }
    }

    /* ── RENDER SCHEDULING ── */
    scheduleRender() {
        if (this.renderScheduled) return;
        this.renderScheduled = true;
        requestAnimationFrame(() => { this.renderCanvas(); this.renderScheduled = false; });
    }

    /* ── CANVAS SIZING ── */
    resizeCanvas() {
        const w = Math.max(2000, this.container.clientWidth);
        const h = Math.max(this.container.clientHeight * 2, this.canvasHeight, 1600);
        this.canvas.width  = w;
        this.canvas.height = h;
        this.offscreenCanvas.width  = w;
        this.offscreenCanvas.height = h;
        this.canvas.style.width  = w + 'px';
        this.canvas.style.height = h + 'px';
        this.canvasHeight = h;
        this.cachedOffscreenValid = false;
        this._invalidateCanvasRect();
        this.scheduleRender();
    }

    ensureCanvasFor(y) { if (y < this.canvasHeight - 500) return; this.extendCanvas(); }

    extendCanvas() {
        this.canvasHeight += 1200;
        this.canvas.height = this.canvasHeight;
        this.offscreenCanvas.height = this.canvasHeight;
        this.canvas.style.height = this.canvasHeight + 'px';
        this.cachedOffscreenValid = false;
        this.scheduleRender();
    }

    /* ── COLORS ── */
    getBgColor()   { return this.mode === 'dark' ? '#17191d' : '#fffdf8'; }
    getGridColor() { return this.mode === 'dark' ? 'rgba(210,221,232,0.13)' : 'rgba(76,98,122,0.23)'; }
    getLinesColor(){ return this.mode === 'dark' ? 'rgba(210,221,232,0.15)' : 'rgba(61,94,128,0.25)'; }

    /* ── RENDER ── */
    renderCanvas() {
        this.updateViewport();
        this.ctx.save();
        this.ctx.setTransform(1,0,0,1,0,0);
        this.ctx.globalCompositeOperation = 'source-over';
        this.ctx.fillStyle = this.getBgColor();
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        if (this.backgroundStyle === 'grid')  this.drawGrid();
        if (this.backgroundStyle === 'lines') this.drawLines();

        // Always draw from offscreen canvas if valid
        if (this.cachedOffscreenValid) {
            this.ctx.drawImage(this.offscreenCanvas, 0, 0);
        } else {
            this.offscreenCtx.clearRect(0, 0, this.offscreenCanvas.width, this.offscreenCanvas.height);
            this.items.forEach(item => {
                if (this.isStrokeVisible(item) || item.type === 'image') {
                    this.drawItem(item, this.offscreenCtx);
                }
            });
            this.ctx.drawImage(this.offscreenCanvas, 0, 0);
            this.cachedOffscreenValid = true;
        }

        // Draw current stroke directly on main canvas (not offscreen) during active drawing
        // This avoids invalidating the cache and triggering full redraws
        if (this.currentStroke && this.currentStroke.type !== 'stroke-eraser') {
            this.drawItem(this.currentStroke, this.ctx);
        }
        if (this.currentStroke && this.currentStroke.type === 'stroke-eraser') {
            this.drawEraserPreview(this.currentStroke);
        }
        this.drawSelection();
        this.drawLassoPreview();
        this.ctx.restore();
    }

    drawGrid() {
        const size = 30;
        this.ctx.save();
        this.ctx.strokeStyle = this.getGridColor();
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        for (let x = size; x < this.canvas.width; x += size) { this.ctx.moveTo(x+.5, this.viewportTop); this.ctx.lineTo(x+.5, this.viewportBottom); }
        for (let y = Math.ceil(this.viewportTop/size)*size; y < this.viewportBottom; y += size) { this.ctx.moveTo(0, y+.5); this.ctx.lineTo(this.canvas.width, y+.5); }
        this.ctx.stroke();
        this.ctx.restore();
    }

    drawLines() {
        const spacing = 32;
        this.ctx.save();
        this.ctx.strokeStyle = this.getLinesColor();
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        for (let y = Math.ceil(this.viewportTop/spacing)*spacing; y < this.viewportBottom; y += spacing) { this.ctx.moveTo(0, y+.5); this.ctx.lineTo(this.canvas.width, y+.5); }
        this.ctx.stroke();
        this.ctx.restore();
    }

    drawItem(item, tCtx = this.ctx) {
        if (item.type === 'image') { const img = item.imageElement; if (img) tCtx.drawImage(img, 0, 0, this.canvas.width, item.height || this.canvas.height); return; }
        if (item.type === 'stroke-eraser') { this.drawEraserPreview(item); return; }
        if (!item.points || item.points.length === 0) return;
        tCtx.save();
        tCtx.globalCompositeOperation = 'source-over';
        if (item.type === 'eraser') tCtx.globalCompositeOperation = 'destination-out';
        tCtx.strokeStyle = item.type === 'eraser' ? '#000' : item.color;
        tCtx.fillStyle   = item.type === 'eraser' ? '#000' : item.color;
        tCtx.lineWidth   = item.width;
        tCtx.lineCap = 'round'; tCtx.lineJoin = 'round';
        if (item.points.length === 1) {
            const p = item.points[0];
            tCtx.beginPath(); tCtx.arc(p.x, p.y, item.width/2, 0, Math.PI*2); tCtx.fill();
        } else {
            this.drawSmoothPath(tCtx, item.points, item.width, item.hasPressure);
        }
        tCtx.restore();
    }

    drawSmoothPath(tCtx, pts, baseWidth = 3, hasPressure) {
        if (pts.length < 2) return;
        // hasPressure cached on stroke; fall back to scan only for old saved strokes
        if (hasPressure === undefined) hasPressure = pts.some(p => p.p !== undefined && p.p !== 1);
        if (!hasPressure) {
            tCtx.beginPath(); tCtx.moveTo(pts[0].x, pts[0].y);
            if (pts.length === 2) { tCtx.lineTo(pts[1].x, pts[1].y); tCtx.stroke(); return; }
            for (let i = 1; i < pts.length-1; i++) {
                const mx = (pts[i].x + pts[i+1].x)/2, my = (pts[i].y + pts[i+1].y)/2;
                tCtx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
            }
            tCtx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
            tCtx.stroke();
            return;
        }

        // Pressure-sensitive drawing
        let lastPoint = pts[0];
        
        // Draw initial cap
        tCtx.beginPath();
        tCtx.arc(lastPoint.x, lastPoint.y, (baseWidth * (0.3 + 1.2 * (lastPoint.p !== undefined ? lastPoint.p : 1))) / 2, 0, Math.PI * 2);
        tCtx.fill();

        for (let i = 0; i < pts.length - 1; i++) {
            const p1 = pts[i];
            const p2 = pts[i+1];
            const press1 = p1.p !== undefined ? p1.p : 1;
            const press2 = p2.p !== undefined ? p2.p : 1;
            const press = (press1 + press2) / 2;
            tCtx.lineWidth = baseWidth * (0.3 + 1.2 * press);
            
            tCtx.beginPath();
            tCtx.moveTo(lastPoint.x, lastPoint.y);
            
            if (i < pts.length - 2) {
                const p3 = pts[i+2];
                const mx = (p2.x + p3.x) / 2;
                const my = (p2.y + p3.y) / 2;
                tCtx.quadraticCurveTo(p2.x, p2.y, mx, my);
                lastPoint = { x: mx, y: my, p: press2 };
            } else {
                tCtx.lineTo(p2.x, p2.y);
                lastPoint = p2;
            }
            tCtx.stroke();
            
            // Draw a cap at the joint to prevent visual gaps
            tCtx.beginPath();
            tCtx.arc(lastPoint.x, lastPoint.y, tCtx.lineWidth / 2, 0, Math.PI * 2);
            tCtx.fill();
        }
    }

    drawIncrementalTail(tCtx, item) {
        const pts = item.points;
        const len = pts.length;
        if (len < 2) return;
        
        tCtx.save();
        if (item.type === 'eraser') tCtx.globalCompositeOperation = 'destination-out';
        tCtx.strokeStyle = item.type === 'eraser' ? '#000' : item.color;
        tCtx.fillStyle   = item.type === 'eraser' ? '#000' : item.color;
        tCtx.lineCap = 'round';
        tCtx.lineJoin = 'round';
        
        const baseWidth = item.width;
        // hasPressure is cached on the stroke — O(1) lookup instead of O(n) scan
        let hasPressure = item.hasPressure || false;
        
        if (!hasPressure) {
            tCtx.lineWidth = baseWidth;
            tCtx.beginPath();
            if (len === 2) {
                tCtx.moveTo(pts[0].x, pts[0].y); tCtx.lineTo(pts[1].x, pts[1].y);
            } else {
                const a=pts[len-3], b=pts[len-2], c=pts[len-1];
                tCtx.moveTo((a.x+b.x)/2, (a.y+b.y)/2);
                tCtx.quadraticCurveTo(b.x, b.y, (b.x+c.x)/2, (b.y+c.y)/2);
            }
            tCtx.stroke();
            tCtx.restore();
            return;
        }

        if (len === 2) {
            const p1 = pts[0], p2 = pts[1];
            const press1 = p1.p !== undefined ? p1.p : 1;
            const press2 = p2.p !== undefined ? p2.p : 1;
            const press = (press1 + press2) / 2;
            
            tCtx.beginPath();
            tCtx.arc(p1.x, p1.y, (baseWidth * (0.3 + 1.2 * press1)) / 2, 0, Math.PI * 2);
            tCtx.fill();
            
            tCtx.lineWidth = baseWidth * (0.3 + 1.2 * press);
            tCtx.beginPath();
            tCtx.moveTo(p1.x, p1.y); tCtx.lineTo(p2.x, p2.y);
            tCtx.stroke();
            
            tCtx.beginPath();
            tCtx.arc(p2.x, p2.y, tCtx.lineWidth / 2, 0, Math.PI * 2);
            tCtx.fill();
            tCtx.restore();
            return;
        }

        const i = len - 3;
        const p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2];
        const press = ((p1.p !== undefined ? p1.p : 1) + (p2.p !== undefined ? p2.p : 1)) / 2;
        
        const startX = i === 0 ? p1.x : (p1.x + p2.x) / 2;
        const startY = i === 0 ? p1.y : (p1.y + p2.y) / 2;
        const mx = (p2.x + p3.x) / 2;
        const my = (p2.y + p3.y) / 2;

        tCtx.lineWidth = baseWidth * (0.3 + 1.2 * press);
        tCtx.beginPath();
        tCtx.moveTo(startX, startY);
        tCtx.quadraticCurveTo(p2.x, p2.y, mx, my);
        tCtx.stroke();
        
        tCtx.beginPath();
        tCtx.arc(mx, my, tCtx.lineWidth / 2, 0, Math.PI * 2);
        tCtx.fill();
        tCtx.restore();
    }

    drawEraserPreview(item) {
        if (!item.points || item.points.length === 0) return;
        this.ctx.save();
        this.ctx.globalCompositeOperation = 'source-over';
        
        // Enhanced visual feedback for stroke eraser
        if (this.eraserMode === 'stroke') {
            // Show translucent red preview for stroke eraser
            this.ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
            this.ctx.fillStyle = 'rgba(255, 50, 50, 0.15)';
            this.ctx.lineWidth = item.width;
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
            this.ctx.setLineDash([4, 6]);
            
            // Draw the path
            if (item.points.length === 1) {
                this.ctx.beginPath();
                this.ctx.arc(item.points[0].x, item.points[0].y, item.width/2, 0, Math.PI*2);
                this.ctx.fill();
            } else {
                this.drawSmoothPath(this.ctx, item.points);
                // Also fill the area for better visibility
                this.ctx.setLineDash([]);
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.fillStyle = 'rgba(255, 50, 50, 0.08)';
                this.drawSmoothPath(this.ctx, item.points);
            }
        } else {
            // Area eraser preview (original)
            this.ctx.strokeStyle = this.mode === 'dark' ? 'rgba(238,246,255,.55)' : 'rgba(37,99,150,.45)';
            this.ctx.lineWidth = item.width;
            this.ctx.lineCap = 'round';
            this.ctx.lineJoin = 'round';
            this.ctx.setLineDash([2, 8]);
            this.drawSmoothPath(this.ctx, item.points);
        }
        
        this.ctx.restore();
    }

    drawSelection() {
        if (this.selectedIds.size === 0) return;
        this.ctx.save();
        this.ctx.globalCompositeOperation = 'source-over';
        this.ctx.strokeStyle = this.mode === 'dark' ? '#a78bfa' : '#7c6ff7';
        this.ctx.lineWidth = 2; this.ctx.setLineDash([6,5]);
        this.items.forEach(item => {
            if (!this.selectedIds.has(item.id) || item.type !== 'stroke') return;
            const box = this.getStrokeBounds(item);
            if (box.maxY < this.viewportTop-100 || box.minY > this.viewportBottom+100) return;
            this.ctx.strokeRect(box.minX-8, box.minY-8, box.maxX-box.minX+16, box.maxY-box.minY+16);
        });
        this.ctx.restore();
    }

    drawLassoPreview() {
        if (!this.currentLasso || this.currentLasso.length < 2) return;
        this.ctx.save();
        this.ctx.strokeStyle = this.mode === 'dark' ? '#a78bfa' : '#7c6ff7';
        this.ctx.fillStyle   = this.mode === 'dark' ? 'rgba(167,139,250,.08)' : 'rgba(124,111,247,.08)';
        this.ctx.lineWidth = 2; this.ctx.setLineDash([6,5]);
        this.ctx.beginPath(); this.ctx.moveTo(this.currentLasso[0].x, this.currentLasso[0].y);
        for (let i=1; i<this.currentLasso.length; i++) this.ctx.lineTo(this.currentLasso[i].x, this.currentLasso[i].y);
        this.ctx.closePath(); this.ctx.fill(); this.ctx.stroke();
        this.ctx.restore();
    }

    /* ── EVENT LISTENERS ── */
    setupEventListeners() {
        this.canvas.addEventListener('pointerdown',      e => this.startDraw(e));
        this.canvas.addEventListener('pointermove',      e => this.draw(e));
        this.canvas.addEventListener('pointerup',        e => this.stopDraw(e));
        this.canvas.addEventListener('pointercancel',    e => this.stopDraw(e));
        this.canvas.addEventListener('lostpointercapture', e => this.stopDraw(e));

        // Wheel: zoom (Ctrl) or scroll
        this.container.addEventListener('wheel', e => this.handleWheel(e), { passive: false });

        // Tool buttons
        this.dom.penBtn.onclick    = (e) => { 
            if (this.currentTool === 'pen') {
                this.openMenu(this.dom.penMenu, this.dom.penBtn);
            } else {
                this.setTool('pen');
                this.closeAllMenus();
            }
        };
        this.dom.eraserBtn.onclick = (e) => { 
            if (this.currentTool === 'eraser') {
                this.openMenu(this.dom.eraserMenu, this.dom.eraserBtn);
            } else {
                this.setTool('eraser');
                this.closeAllMenus();
            }
        };
        this.dom.lassoBtn.onclick  = () => { this.setTool('lasso'); this.closeAllMenus(); };

        this.dom.clearBtn.onclick = () => this.clear();
        this.dom.undoBtn.onclick  = () => this.undo();
        this.dom.redoBtn.onclick  = () => this.redo();
        this.dom.copySelectionBtn.onclick   = () => this.copySelection();
        this.dom.cutSelectionBtn.onclick    = () => this.cutSelection();
        this.dom.pasteSelectionBtn.onclick  = () => this.pasteSelection();
        this.dom.deleteSelectionBtn.onclick = () => this.deleteSelection();
        this.dom.clearSelectionBtn.onclick  = () => this.clearSelection();
        this.dom.saveFavoritePenBtn.onclick = () => this.saveFavoritePen();

        document.getElementById('exportBtn').onclick     = () => this.export();
        document.getElementById('exportBtnMenu').onclick = () => { this.export(); this.closeAllMenus(); };
        document.getElementById('manualSaveBtn').onclick = () => this.manualSave();
        
        // New note button in sidebar
        document.getElementById('newNoteBtnSidebar').onclick = () => this.createNewNote();

        // Settings button
        this.dom.settingsBtn.onclick = e => {
            e.stopPropagation();
            const isOpen = this.dom.settingsMenu.classList.contains('open');
            this.closeAllMenus();
            if (!isOpen) this.openMenu(this.dom.settingsMenu, this.dom.settingsBtn);
        };
        
        // Version History button
        document.getElementById('versionHistoryBtn').onclick = async (e) => {
            e.stopPropagation();
            this.closeAllMenus();
            await this.showVersionHistory();
        };

        // Notes Sidebar Filters & Search
        const searchInput = document.getElementById('noteSearchInput');
        const sortSelect = document.getElementById('noteSortSelect');
        const pinFilterBtn = document.getElementById('notePinFilterBtn');
        const activeTabBtn = document.getElementById('activeNotesTab');
        const trashTabBtn = document.getElementById('trashNotesTab');

        if (searchInput) {
            searchInput.oninput = e => {
                this.notesSearchQuery = e.target.value.toLowerCase().trim();
                this.loadNotes();
            };
        }
        if (sortSelect) {
            sortSelect.onchange = e => {
                this.notesSortBy = e.target.value;
                this.loadNotes();
            };
        }
        if (pinFilterBtn) {
            pinFilterBtn.onclick = () => {
                this.notesPinnedOnly = !this.notesPinnedOnly;
                pinFilterBtn.classList.toggle('active', this.notesPinnedOnly);
                this.loadNotes();
            };
        }
        if (activeTabBtn && trashTabBtn) {
            activeTabBtn.onclick = () => {
                this.notesTab = 'active';
                activeTabBtn.classList.add('active');
                trashTabBtn.classList.remove('active');
                this.loadNotes();
            };
            trashTabBtn.onclick = () => {
                this.notesTab = 'trash';
                trashTabBtn.classList.add('active');
                activeTabBtn.classList.remove('active');
                this.loadNotes();
            };
        }

        // Recovery Banner
        const restoreBtn = document.getElementById('restoreRecoveryBtn');
        const dismissBtn = document.getElementById('dismissRecoveryBtn');
        if (restoreBtn) {
            restoreBtn.onclick = () => {
                const restored = this.restoreFromRecovery();
                if (restored) {
                    this.updateSaveState('saved');
                }
                const banner = document.getElementById('recoveryBanner');
                if (banner) banner.style.display = 'none';
            };
        }
        if (dismissBtn) {
            dismissBtn.onclick = () => {
                localStorage.removeItem('recovery_buffer');
                const banner = document.getElementById('recoveryBanner');
                if (banner) banner.style.display = 'none';
            };
        }

        // Backdrop closes menus
        document.getElementById('menuBackdrop').onclick = () => this.closeAllMenus();

        // Color picker
        this.dom.colorPicker.oninput = e => {
            this.currentColor = e.target.value;
            // Also update swatches selection
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            this.saveToolConfig();
            this.showPenFeedback();
        };

        // Brush / eraser sliders
        this.dom.brushSize.oninput = e => {
            this.brushSize = parseFloat(e.target.value);
            this.dom.sizeValue.innerText = this.brushSize.toFixed(1) + 'px';
            this.saveToolConfig();
            this.showPenFeedback();
        };
        this.dom.eraserSize.oninput = e => {
            this.eraserSize = parseInt(e.target.value, 10);
            this.dom.eraserSizeValue.innerText = this.eraserSize + 'px';
            this.saveToolConfig();
        };

        // Cursor Preview — GPU-composited, zero reflows, single DOM element cached
        this._cursorPreviewEl = document.getElementById('cursorPreview');
        this._cursorToolCache = null; // track tool to avoid redundant style sets
        this.container.addEventListener('pointermove', (e) => {
            const el = this._cursorPreviewEl;
            if (!el) return;
            const tool = this.currentTool;
            if (tool !== 'pen' && tool !== 'eraser') { el.style.display = 'none'; return; }
            
            // Only update color/size when tool changes (not on every move)
            if (this._cursorToolCache !== tool + this.brushSize + this.eraserSize) {
                this._cursorToolCache = tool + this.brushSize + this.eraserSize;
                const sz = (tool === 'eraser' ? this.eraserSize : this.brushSize) * this.zoom;
                el.style.width  = sz + 'px';
                el.style.height = sz + 'px';
                el.style.marginLeft = (-sz / 2) + 'px';
                el.style.marginTop  = (-sz / 2) + 'px';
                el.style.backgroundColor = (tool === 'pen') ? this.currentColor : 'transparent';
                el.style.opacity = (tool === 'pen') ? '0.45' : '1';
                el.style.borderColor = (tool === 'pen') ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.5)';
            }
            
            const cr = this._getCanvasRect();
            const x = e.clientX - cr.left;
            const y = e.clientY - cr.top;
            // GPU-composited transform — zero layout reflow
            el.style.transform = `translate3d(${x}px,${y}px,0)`;
            el.style.display = 'block';
        });
        this.container.addEventListener('pointerleave', () => {
            if (this._cursorPreviewEl) this._cursorPreviewEl.style.display = 'none';
        });

        // Eraser mode
        this.dom.pixelEraserBtn.onclick  = () => this.setEraserMode('area');
        this.dom.strokeEraserBtn.onclick = () => this.setEraserMode('stroke');

        // Mode + background (inside settings menu)
        this.dom.lightModeBtn.onclick = () => { this.setMode('light'); };
        this.dom.darkModeBtn.onclick  = () => { this.setMode('dark'); };
        this.dom.cleanBtn.onclick     = () => { this.setBackground('clean'); };
        this.dom.gridBtn.onclick      = () => { this.setBackground('grid'); };
        this.dom.linesBtn.onclick     = () => { this.setBackground('lines'); };

        // Zoom buttons
        this.dom.zoomInBtn.onclick   = () => this.setZoom(this.zoom + 0.1);
        this.dom.zoomOutBtn.onclick  = () => this.setZoom(this.zoom - 0.1);
        this.dom.resetZoomBtn.onclick= () => this.setZoom(1);

        // Sidebar
        this.dom.toggleSidebarBtn.onclick = () => this.toggleSidebar();
        document.getElementById('closeSidebarBtn').onclick = () => this.toggleSidebar();

        // Scroll - OPTIMIZED: No cache invalidation during scroll
        let scrollTimeout;
        let scrollRafId = null;
        this.container.addEventListener('scroll', () => {
            this.updateViewport();
            
            // Use requestAnimationFrame to throttle renders during scroll
            if (scrollRafId !== null) {
                cancelAnimationFrame(scrollRafId);
            }
            scrollRafId = requestAnimationFrame(() => {
                // Only render during scroll - cache remains valid
                // We just draw the viewport from the existing offscreen canvas
                this.renderCanvas();
                scrollRafId = null;
            });
            
            // Clear previous timeout
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                // After scrolling stops, do one final render to ensure everything is crisp
                this.renderCanvas();
            }, 50);
            
            const nearBottom = this.container.scrollTop + this.container.clientHeight > this.container.scrollHeight - 450;
            if (nearBottom) this.extendCanvas();
        }, { passive: true });

        document.addEventListener('keydown', e => {
            // Verify the whiteboard instance is available
            if (typeof this.undo === 'function') {
                this.handleKeyboard(e);
            } else {
                console.warn('Whiteboard methods not yet initialized');
            }
        });
        window.addEventListener('beforeunload', () => this.saveCurrentNote());
        window.addEventListener('resize', () => { this.invalidateRect(); this.resizeCanvas(); });
        this.updateActiveStates();

        // ── 2-FINGER TOUCH PANNING (for non-stylus touch screens) ──────────────
        // When the user draws with a stylus, only 1 pointer is active → goes to
        // canvas. When they use 2 fingers, we treat it as a pan gesture.
        let _touchCount = 0;
        let _panLastX = 0, _panLastY = 0;
        this.container.addEventListener('pointerdown', (e) => {
            _touchCount++;
            if (_touchCount >= 2 && !this.isDrawing) {
                // Start 2-finger pan
                _panLastX = e.clientX;
                _panLastY = e.clientY;
            }
        }, { passive: false });
        this.container.addEventListener('pointermove', (e) => {
            if (_touchCount < 2 || this.isDrawing) return;
            const dx = e.clientX - _panLastX;
            const dy = e.clientY - _panLastY;
            this.container.scrollLeft -= dx;
            this.container.scrollTop  -= dy;
            _panLastX = e.clientX;
            _panLastY = e.clientY;
        }, { passive: false });
        this.container.addEventListener('pointerup',     () => { _touchCount = Math.max(0, _touchCount - 1); }, { passive: true });
        this.container.addEventListener('pointercancel', () => { _touchCount = 0; }, { passive: true });
    }

    toggleSidebar() {
        this.dom.notesSidebar.classList.toggle('hidden');
        this._invalidateCanvasRect();
    }

    /* ── ZOOM ── */
    setZoom(z) {
        this.zoom = Math.min(3, Math.max(0.25, Math.round(z * 100) / 100));
        this.canvas.style.transform = `scale(${this.zoom})`;
        this.canvas.style.transformOrigin = '0 0';
        this.dom.zoomDisplay.textContent = Math.round(this.zoom * 100) + '%';
        this._invalidateCanvasRect(); // canvas visual size changed
        this.saveToolConfig();
    }

    handleWheel(e) {
        if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const delta = -e.deltaY * 0.001;
            this.setZoom(this.zoom + delta * 0.8);
        } else if (e.shiftKey) {
            e.preventDefault();
            this.container.scrollLeft += e.deltaY;
        } else {
            // Since touch-action:none disables native scroll, we must drive it via JS
            e.preventDefault();
            // Use passive-friendly scroll accumulation to avoid jank
            // Batch scroll updates to reduce layout thrashing
            if (this._wheelRafId) cancelAnimationFrame(this._wheelRafId);
            this._wheelRafId = requestAnimationFrame(() => {
                this.container.scrollLeft += e.deltaX;
                this.container.scrollTop  += e.deltaY;
                this._wheelRafId = null;
            });
        }
    }

    /* ── KEYBOARD ── */
    handleKeyboard(e) {
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (['INPUT','TEXTAREA','SELECT'].includes(activeTag)) return;
        const mod = e.ctrlKey || e.metaKey;
        
        // Debug logging to console (remove after testing)
        console.log('Key pressed:', e.key, 'Ctrl:', mod, 'Shift:', e.shiftKey);
        
        // Undo/Redo with visual feedback
        // Support both e.key and e.code for better cross-browser compatibility
        const key = e.key.toLowerCase();
        if (mod && (key === 'z' || key === 'у') && !e.shiftKey) { // 'у' for Russian keyboard layout
            e.preventDefault();
            e.stopPropagation();
            this.undo();
            this.showShortcutFeedback('Undo (Ctrl+Z)');
        }
        else if ((mod && (key === 'y' || key === 'н')) || (mod && e.shiftKey && (key === 'z' || key === 'у'))) {
            e.preventDefault();
            e.stopPropagation();
            this.redo();
            this.showShortcutFeedback('Redo (Ctrl+Y)');
        }
        else if (mod && e.key === 's') {
            e.preventDefault();
            this.manualSave();
            this.showShortcutFeedback('Saved');
        }
        else if (mod && e.key === '0') {
            e.preventDefault();
            this.setZoom(1);
            this.showShortcutFeedback('Zoom 100%');
        }
        else if (mod && (e.key==='='||e.key==='+')) {
            e.preventDefault();
            this.setZoom(this.zoom+0.1);
            this.showShortcutFeedback(`Zoom ${Math.round(this.zoom*100)}%`);
        }
        else if (mod && e.key==='-') {
            e.preventDefault();
            this.setZoom(this.zoom-0.1);
            this.showShortcutFeedback(`Zoom ${Math.round(this.zoom*100)}%`);
        }
        else if (mod && e.key.toLowerCase()==='c') {
            e.preventDefault();
            this.copySelection();
            this.showShortcutFeedback('Copied');
        }
        else if (mod && e.key.toLowerCase()==='x') {
            e.preventDefault();
            this.cutSelection();
            this.showShortcutFeedback('Cut');
        }
        else if (mod && e.key.toLowerCase()==='v') {
            e.preventDefault();
            this.pasteSelection();
            this.showShortcutFeedback('Pasted');
        }
        else if ((e.key==='Delete'||e.key==='Backspace') && this.selectedIds.size>0) {
            e.preventDefault();
            this.deleteSelection();
            this.showShortcutFeedback('Deleted');
        }
        else if (e.key==='Escape') {
            this.closeAllMenus();
            this.showShortcutFeedback('Menu closed');
        }
    }
    
    showShortcutFeedback(message) {
        // Show temporary feedback for keyboard shortcuts
        let feedback = document.getElementById('shortcutFeedback');
        if (!feedback) {
            feedback = document.createElement('div');
            feedback.id = 'shortcutFeedback';
            feedback.style.cssText = `
                position: fixed;
                bottom: 70px;
                right: 20px;
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 8px 16px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                z-index: 10000;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.2s ease;
                backdrop-filter: blur(8px);
                font-family: system-ui, -apple-system, sans-serif;
            `;
            document.body.appendChild(feedback);
        }
        
        feedback.textContent = message;
        feedback.style.opacity = '1';
        clearTimeout(this._feedbackShortcutTimeout);
        this._feedbackShortcutTimeout = setTimeout(() => {
            feedback.style.opacity = '0';
        }, 1200);
    }

    /* ── TOOLS ── */
    showPenFeedback() {
        const badge = document.getElementById('penFeedback');
        const color = document.getElementById('penFeedbackColor');
        const text = document.getElementById('penFeedbackText');
        if (!badge || !color || !text) return;
        
        color.style.backgroundColor = this.currentColor;
        text.textContent = `${this.brushSize}px`;
        
        badge.style.opacity = '1';
        clearTimeout(this._feedbackTimeout);
        this._feedbackTimeout = setTimeout(() => {
            badge.style.opacity = '0';
        }, 1500);
    }
    setTool(tool) {
        this.currentTool = tool;
        if (tool !== 'lasso') this.clearSelection(false);
        this.updateActiveStates();
        this.updateCursor();
        this.saveToolConfig();
    }
    
    updateCursor() {
        // Remove all cursor classes
        this.canvas.classList.remove('pen-cursor', 'eraser-cursor', 'lasso-cursor');
        
        // Add appropriate cursor class based on current tool
        switch(this.currentTool) {
            case 'pen':
                this.canvas.classList.add('pen-cursor');
                break;
            case 'eraser':
                this.canvas.classList.add('eraser-cursor');
                break;
            case 'lasso':
                this.canvas.classList.add('lasso-cursor');
                break;
        }
    }

    setMode(mode) {
        this.mode = mode;
        this.dirty = true;
        this.cachedOffscreenValid = false;
        // Toggle dark mode class on body for custom cursors
        document.body.classList.toggle('dark-mode', mode === 'dark');
        // Update toolbar theme hint
        document.documentElement.style.setProperty('--surface', mode==='dark' ? '#1e2029' : '#ffffff');
        document.documentElement.style.setProperty('--surface2', mode==='dark' ? '#15171e' : '#f6f6fb');
        document.documentElement.style.setProperty('--border',  mode==='dark' ? '#2e3048' : '#e4e4ef');
        document.documentElement.style.setProperty('--text',    mode==='dark' ? '#e8e8f8' : '#1a1a2e');
        document.documentElement.style.setProperty('--text-muted', mode==='dark' ? '#8888aa' : '#7a7a9a');
        this.updateActiveStates();
        this.scheduleRender();
        this.saveToolConfig();
    }

    setBackground(style) {
        this.backgroundStyle = style;
        this.dirty = true;
        this.cachedOffscreenValid = false;
        this.updateActiveStates();
        this.scheduleRender();
        this.saveToolConfig();
    }

    setEraserMode(mode) { this.eraserMode = mode; this.updateActiveStates(); this.saveToolConfig(); }

    updateActiveStates() {
        ['penBtn','eraserBtn','lassoBtn'].forEach(id => this.dom[id].classList.remove('active'));
        this.dom[this.currentTool+'Btn'].classList.add('active');
        this.dom.lightModeBtn.classList.toggle('active', this.mode==='light');
        this.dom.darkModeBtn.classList.toggle ('active', this.mode==='dark');
        this.dom.cleanBtn.classList.toggle('active', this.backgroundStyle==='clean');
        this.dom.gridBtn.classList.toggle ('active', this.backgroundStyle==='grid');
        this.dom.linesBtn.classList.toggle('active', this.backgroundStyle==='lines');
        this.dom.pixelEraserBtn.classList.toggle ('active', this.eraserMode==='area');
        this.dom.strokeEraserBtn.classList.toggle('active', this.eraserMode==='stroke');
        
        // Hide/Show selection actions
        const hasSelection = this.selectedIds.size > 0 || this.clipboardItems.length > 0;
        this.dom.selectionActions.style.display = hasSelection ? 'flex' : 'none';
        
        // Favorite pens styling
        const wrap = document.getElementById('quickPens');
        if (wrap) {
            wrap.querySelectorAll('.favorite-pen').forEach(btn => {
                const p = this.favoritePens[btn.dataset.index];
                if (p) {
                    const isActive = p.color === this.currentColor && p.size === this.brushSize && this.currentTool === 'pen';
                    btn.classList.toggle('active', isActive);
                    if (isActive) {
                        btn.style.boxShadow = `0 0 0 2px var(--surface), 0 0 0 4px ${p.color}`;
                    } else {
                        btn.style.boxShadow = 'none';
                    }
                }
            });
        }
    }

    /* ── DRAWING ── */
    startDraw(e) {
        e.preventDefault();
        e.stopPropagation();
        // Capture the pointer so all subsequent move/up events come to us
        // even if the pointer leaves the canvas element.
        try {
            if (e.pointerId !== undefined) this.canvas.setPointerCapture(e.pointerId);
        } catch (_) { /* ignore if capture fails (e.g. mouse already captured) */ }
        const pos = this.getPos(e);
        this.ensureCanvasFor(pos.y);
        this.isDrawing = true;
        this.erasedDuringStroke = false;

        if (this.currentTool === 'lasso') { this.currentLasso = [pos]; this.scheduleRender(); return; }
        if (this.currentTool === 'eraser' && this.eraserMode === 'stroke') {
            this.currentStroke = { type:'stroke-eraser', points:[pos], width:this.eraserSize };
            this.eraseIntersectingStrokesOptimized(pos, pos);
            this.scheduleRender(); return;
        }
        this.currentStroke = {
            id: this.createId(),
            type: this.currentTool === 'eraser' ? 'eraser' : 'stroke',
            color: this.currentColor,
            width: this.currentTool === 'eraser' ? this.eraserSize : this.brushSize,
            points: [pos]
        };
        this.scheduleRender();
        this.dirty = true;
        this.updateSaveState('editing');
    }

    draw(e) {
        if (!this.isDrawing) return;
        e.preventDefault();
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        let need = false;
        for (const pe of events) need = this.appendDrawPoint(this.getPos(pe)) || need;
        if (need) this.scheduleRender();
    }

    appendDrawPoint(pos) {
        this.ensureCanvasFor(pos.y);
        if (this.currentTool === 'lasso') { this.currentLasso.push(pos); return true; }
        if (!this.currentStroke) return false;
        const last = this.currentStroke.points[this.currentStroke.points.length-1];
        if (Math.hypot(pos.x-last.x, pos.y-last.y) < 0.05) return false;
        this.currentStroke.points.push(pos);
        // Keep hasPressure flag up to date — O(1), avoids O(n^2) scan
        if (!this.currentStroke.hasPressure && pos.p !== undefined && pos.p !== 1) {
            this.currentStroke.hasPressure = true;
        }
        if (this.currentTool === 'eraser' && this.eraserMode === 'stroke') {
            // Interpolate between last and current point for smoother erasing
            const dx = pos.x - last.x;
            const dy = pos.y - last.y;
            const distance = Math.hypot(dx, dy);
            const stepSize = this.eraserSize * 0.5; // Sample every half eraser size
            
            if (distance > stepSize) {
                const steps = Math.ceil(distance / stepSize);
                for (let step = 1; step <= steps; step++) {
                    const t = step / steps;
                    const interpX = last.x + dx * t;
                    const interpY = last.y + dy * t;
                    this.eraseIntersectingStrokesOptimized(
                        { x: interpX, y: interpY },
                        { x: interpX, y: interpY }
                    );
                }
            }
            this.eraseIntersectingStrokesOptimized(last, pos);
            return true;
        }
        
        // Zero-latency incremental rendering directly to the canvas!
        this.drawIncrementalTail(this.ctx, this.currentStroke);
        return false;
    }

    stopDraw(e) {
        if (!this.isDrawing) return;
        if (e && e.pointerId!==undefined && this.canvas.hasPointerCapture(e.pointerId)) this.canvas.releasePointerCapture(e.pointerId);
        this.isDrawing = false;

        if (this.currentTool === 'lasso') { this.selectWithLasso(); this.currentLasso=null; this.scheduleRender(); this.updateActiveStates(); return; }
        if (this.currentTool === 'eraser' && this.eraserMode === 'stroke') {
            this.currentStroke = null;
            if (this.erasedDuringStroke && this._pendingRemovals && this._pendingRemovals.size > 0) {
                // DELETE ALL MARKED STROKES AT ONCE (CRITICAL FIX)
                this.items = this.items.filter(item => !this._pendingRemovals.has(item));
                this.selectedIds.clear();
                this.saveState();
                this.rebuildSpatialIndex();
                this.cachedOffscreenValid = false;
                this.scheduleRender();
                this.erasedDuringStroke = false;
                
                // Clear pending removals
                this._pendingRemovals.clear();
            }
            return;
        }
        if (this.currentStroke) {
            // Draw the completed stroke directly onto offscreen canvas BEFORE pushing to items
            // This maintains cache validity without forcing a full redraw
            this.drawItem(this.currentStroke, this.offscreenCtx);
            
            this.items.push(this.currentStroke);
            this.addStrokeToSpatialIndex(this.currentStroke, this.items.length-1);
            this.currentStroke = null;
            
            // Mark that we have a new stroke for history
            this._pendingStroke = true;
            
            // Save state for undo/redo
            this.saveState();
            
            // Clear pending flag after save
            this._pendingStroke = false;
            
            this.dirty = true;
            this.scheduleRender();
        }
    }

    queueSave() {
        this.dirty = true;
        clearTimeout(this._saveTimeout);
        // Debounced save — only fires after explicit triggers (manual save, undo, clear, etc.)
        // NOT called after every stroke.
        this._saveTimeout = setTimeout(async () => {
            await this.saveCurrentNote();
        }, 500);
    }

    async manualSave() {
        const btn = document.getElementById('manualSaveBtn');
        if (btn) { btn.textContent = '⏳ Saving...'; btn.disabled = true; }
        this.saveState(); // Commit undo history
        await this.saveCurrentNote();
        if (btn) { btn.textContent = '✅ Saved!'; btn.disabled = false; setTimeout(() => { btn.textContent = '💾 Save'; }, 1500); }
    }

    updateStrokeCountDisplay() {
        const badge = document.getElementById('strokeCountBadge');
        if (badge) {
            const strokeItems = this.items.filter(i => i.type === 'stroke' || i.type === 'eraser');
            badge.textContent = `${strokeItems.length} strokes`;
        }
    }

    /* ── CANVAS RECT CACHE (avoids getBoundingClientRect in draw hot path) ── */
    _getCanvasRect() {
        if (!this._canvasRect) {
            this._canvasRect = this.canvas.getBoundingClientRect();
        }
        return this._canvasRect;
    }

    _invalidateCanvasRect() {
        this._canvasRect = null;
    }

    getPos(e) {
        const canvasRect = this._getCanvasRect();
        const pt = e.touches ? e.touches[0] : e;
        
        // Account for scroll offset in the container
        const scrollX = this.container.scrollLeft;
        const scrollY = this.container.scrollTop;
        
        let x = (pt.clientX - canvasRect.left + scrollX) / this.zoom;
        let y = (pt.clientY - canvasRect.top + scrollY) / this.zoom;
        
        x = Math.max(0, Math.min(x, this.canvas.width));
        y = Math.max(0, Math.min(y, this.canvas.height));
        
        let p = 1;
        if (pt.pointerType === 'pen' && pt.pressure !== undefined) {
            p = pt.pressure;
        }
        
        return { x, y, p };
    }

    createId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe.toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
    }

/* ── ERASE OPTIMIZED - CAPSULE INTERSECTION ── */
    eraseIntersectingStrokesOptimized(a, b) {
        const radius = this.eraserSize * 0.75; // Increased by 50% for better feel
        
        // Use spatial index to get candidate strokes
        const cx = (a.x + b.x) / 2;
        const cy = (a.y + b.y) / 2;
        const candidates = this.getStrokesNearPoint(cx, cy, radius * 2);
        
        if (candidates.length === 0) return;
        
        // Pre-calculate capsule bounds
        const capsuleMinX = Math.min(a.x, b.x) - radius;
        const capsuleMaxX = Math.max(a.x, b.x) + radius;
        const capsuleMinY = Math.min(a.y, b.y) - radius;
        const capsuleMaxY = Math.max(a.y, b.y) + radius;
        
        // Track strokes to remove in this batch
        if (!this._pendingRemovals) this._pendingRemovals = new Set();
        
        for (const stroke of candidates) {
            // Skip if already marked for removal
            if (this._pendingRemovals.has(stroke)) continue;
            
            // Fast bounding box rejection
            const bounds = stroke._bounds || this.getStrokeBounds(stroke);
            if (bounds.maxX < capsuleMinX || bounds.minX > capsuleMaxX ||
                bounds.maxY < capsuleMinY || bounds.minY > capsuleMaxY) {
                continue;
            }
            
            // Capsule intersection test (point to segment distance)
            if (this.capsuleIntersectsStroke(stroke, a, b, radius)) {
                this._pendingRemovals.add(stroke);
            }
        }
        
        // ONLY MARK - NO DELETION DURING ERASING
        if (this._pendingRemovals.size > 0) {
            this.erasedDuringStroke = true;
        }
    }
    
    capsuleIntersectsStroke(stroke, a, b, radius) {
        const points = stroke.points;
        const tol = radius + stroke.width/2;
        
        // Check distance from any point in stroke to the eraser segment
        for (const point of points) {
            const dist = this.distancePointToSegment(point, a, b);
            if (dist <= tol) return true;
        }
        
        return false;
    }
    
    fastStrokeIntersects(stroke, a, b, radius) {
        const points = stroke.points;
        const tol = radius + stroke.width/2;
        
        // Check if any point in the stroke is close to the eraser segment
        for (let i = 0; i < points.length; i++) {
            const p = points[i];
            // Calculate distance from point to line segment (a, b)
            const dist = this.distancePointToSegment(p, a, b);
            if (dist <= tol) return true;
        }
        
        // Also check if any segment of the stroke intersects the eraser
        for (let i = 1; i < points.length; i++) {
            if (this.segmentsNearFast(points[i-1], points[i], a, b, tol)) {
                return true;
            }
        }
        
        return false;
    }
    
    segmentsNearFast(p1, p2, p3, p4, tol) {
        // Check if segments are close using distance checks
        return this.distancePointToSegment(p1, p3, p4) <= tol ||
               this.distancePointToSegment(p2, p3, p4) <= tol ||
               this.distancePointToSegment(p3, p1, p2) <= tol ||
               this.distancePointToSegment(p4, p1, p2) <= tol;
    }
    
    strokeIntersectsSegmentFast(stroke, a, b, tol) {
        // Optimized version with early exits
        if (stroke.points.length === 1) {
            return this.distancePointToSegment(stroke.points[0], a, b) <= tol;
        }
        
        // Check segment intersections with early exit
        for (let i = 1; i < stroke.points.length; i++) {
            if (this.segmentsNearFast(stroke.points[i-1], stroke.points[i], a, b, tol)) {
                return true;
            }
        }
        return false;
    }
    
    segmentsNearFast(a, b, c, d, tol) {
        // Fast bounding box check for segments
        const segBbox = {
            minX: Math.min(a.x, b.x) - tol,
            maxX: Math.max(a.x, b.x) + tol,
            minY: Math.min(a.y, b.y) - tol,
            maxY: Math.max(a.y, b.y) + tol
        };
        const eraserBbox = {
            minX: Math.min(c.x, d.x) - tol,
            maxX: Math.max(c.x, d.x) + tol,
            minY: Math.min(c.y, d.y) - tol,
            maxY: Math.max(c.y, d.y) + tol
        };
        
        // Quick rejection if bounding boxes don't overlap
        if (segBbox.maxX < eraserBbox.minX || segBbox.minX > eraserBbox.maxX ||
            segBbox.maxY < eraserBbox.minY || segBbox.minY > eraserBbox.maxY) {
            return false;
        }
        
        // Only do detailed distance check if bounding boxes overlap
        return this.distancePointToSegment(a, c, d) <= tol || 
               this.distancePointToSegment(b, c, d) <= tol ||
               this.distancePointToSegment(c, a, b) <= tol || 
               this.distancePointToSegment(d, a, b) <= tol ||
               this.segmentsCross(a, b, c, d);
    }

    strokeIntersectsSegment(stroke, a, b, tol) {
        if (stroke.points.length===1) return this.distancePointToSegment(stroke.points[0], a, b)<=tol;
        for (let i=1; i<stroke.points.length; i++) if (this.segmentsNear(stroke.points[i-1], stroke.points[i], a, b, tol)) return true;
        return false;
    }

    segmentsNear(a, b, c, d, tol) {
        return this.distancePointToSegment(a,c,d)<=tol || this.distancePointToSegment(b,c,d)<=tol ||
               this.distancePointToSegment(c,a,b)<=tol || this.distancePointToSegment(d,a,b)<=tol ||
               this.segmentsCross(a,b,c,d);
    }

    distancePointToSegment(p, a, b) {
        const dx=b.x-a.x, dy=b.y-a.y;
        if (dx===0&&dy===0) return Math.hypot(p.x-a.x, p.y-a.y);
        const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));
        return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
    }

    segmentsCross(a, b, c, d) {
        const ccw=(p1,p2,p3)=>(p3.y-p1.y)*(p2.x-p1.x)>(p2.y-p1.y)*(p3.x-p1.x);
        return ccw(a,c,d)!==ccw(b,c,d) && ccw(a,b,c)!==ccw(a,b,d);
    }

    /* ── LASSO / SELECTION ── */
    selectWithLasso() {
        if (!this.currentLasso||this.currentLasso.length<3) return;
        this.selectedIds.clear();
        this.items.forEach(item => { if (item.type==='stroke'&&this.strokeInPolygon(item,this.currentLasso)) this.selectedIds.add(item.id); });
    }

    strokeInPolygon(stroke, poly) {
        if (stroke.points.some(p => this.pointInPolygon(p, poly))) return true;
        for (let i=1; i<stroke.points.length; i++)
            for (let j=0; j<poly.length; j++)
                if (this.segmentsCross(stroke.points[i-1], stroke.points[i], poly[j], poly[(j+1)%poly.length])) return true;
        return false;
    }

    pointInPolygon(pt, poly) {
        let inside=false;
        for (let i=0, j=poly.length-1; i<poly.length; j=i++) {
            if (((poly[i].y>pt.y)!==(poly[j].y>pt.y)) && (pt.x<(poly[j].x-poly[i].x)*(pt.y-poly[i].y)/(poly[j].y-poly[i].y)+poly[i].x))
                inside=!inside;
        }
        return inside;
    }

    copySelection()  { if (!this.selectedIds.size) return; this.clipboardItems=this.items.filter(i=>this.selectedIds.has(i.id)&&i.type==='stroke').map(i=>this.serializeItem(i)); this.updateActiveStates(); }
    cutSelection()   { if (!this.selectedIds.size) return; this.copySelection(); this.deleteSelection(); }

    pasteSelection() {
        if (!this.clipboardItems||!this.clipboardItems.length) return;
        const pasted = this.clipboardItems.map(item => { const c=JSON.parse(JSON.stringify(item)); c.id=this.createId(); c.points=c.points.map(p=>({x:p.x+28,y:p.y+28})); return c; });
        const maxY = Math.max(...pasted.flatMap(i=>i.points.map(p=>p.y)));
        this.ensureCanvasFor(maxY);
        this.items.push(...pasted);
        this.selectedIds = new Set(pasted.map(i=>i.id));
        this.clipboardItems = pasted.map(i=>this.serializeItem(i));
        this.saveState(); this.rebuildSpatialIndex(); this.cachedOffscreenValid=false; this.scheduleRender(); this.updateActiveStates();
        this.queueSave();
    }

    deleteSelection() {
        if (!this.selectedIds.size) return;
        this.items=this.items.filter(i=>!this.selectedIds.has(i.id));
        this.selectedIds.clear();
        this.saveState(); this.rebuildSpatialIndex(); this.cachedOffscreenValid=false; this.scheduleRender(); this.updateActiveStates();
        this.queueSave();
    }

    clearSelection(render=true) { this.selectedIds.clear(); this.updateActiveStates(); if (render) this.scheduleRender(); }

    /* ── BOUNDS ── */
    getStrokeBounds(stroke) {
        if (stroke._bounds) return stroke._bounds;
        let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
        for (const p of stroke.points) { if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
        stroke._bounds = {minX,minY,maxX,maxY};
        return stroke._bounds;
    }

    /* ── HISTORY (OPTIMIZED) ── */
    saveState() {
        // Store only the last stroke as a delta for performance
        if (this._pendingStroke && this.items.length > 0) {
            const lastStrokeIndex = this.items.length - 1;
            const lastStroke = this.serializeItem(this.items[lastStrokeIndex]);
            
            this.history = this.history.slice(0, this.historyIndex+1);
            this.history.push({
                type: 'stroke',
                index: lastStrokeIndex,
                stroke: lastStroke,
                prevLength: this.items.length - 1
            });
            this.historyIndex = this.history.length-1;
            this._pendingStroke = false;
        }
        
        this.dirty = true;
        if (this.history.length > 50) { 
            this.history.shift(); 
            this.historyIndex--; 
        }
    }

    restoreState() {
        if (this.historyIndex < 0 || this.historyIndex >= this.history.length) return;
        
        const entry = this.history[this.historyIndex];
        
        // Incremental restore based on delta
        if (entry.type === 'stroke') {
            if (this.items.length > entry.prevLength) {
                // Undo: remove the last stroke
                this.items.pop();
            } else if (this.items.length === entry.prevLength) {
                // Redo: add the stroke back
                this.items.push(this.deserializeItem(entry.stroke));
            }
        }
        
        this.selectedIds.clear();
        this.rebuildSpatialIndex();
        this.cachedOffscreenValid = false;
        this.scheduleRender();
        this.updateActiveStates();
        this.queueSave();
    }
    
    undo() { 
        if (this.historyIndex > 0) { 
            this.historyIndex--; 
            // Add visual feedback without full re-render delay
            this.showShortcutFeedback('↩️ Undo');
            // Direct restore for speed
            this.restoreState();
        } else {
            this.showShortcutFeedback('Nothing to undo');
        }
    }
    
    redo() { 
        if (this.historyIndex < this.history.length - 1) { 
            this.historyIndex++; 
            this.showShortcutFeedback('↪️ Redo');
            this.restoreState();
        } else {
            this.showShortcutFeedback('Nothing to redo');
        }
    }

    clear() { this.items=[]; this.selectedIds.clear(); this.saveState(); this.rebuildSpatialIndex(); this.cachedOffscreenValid=false; this.scheduleRender(); this.updateActiveStates(); this.queueSave(); }

    export() {
        this.renderCanvas();
        const link = document.createElement('a');
        link.download = 'ezboard.png';
        link.href = this.canvas.toDataURL();
        link.click();
    }

    /* ── RECOVERY BUFFER (disabled - was causing jank every 2 seconds during drawing) ── */
    startRecoveryBuffer() {
        // Recovery buffer disabled. Saving now happens only via:
        //   • 💾 Save button (or Ctrl+S)
        //   • Auto-save every 15 minutes
        //   • Emergency save on tab hide / page close
    }

    restoreFromRecovery() {
        const recoveryData = localStorage.getItem('recovery_buffer');
        if (!recoveryData) return false;
        
        try {
            const data = JSON.parse(recoveryData);
            if (data.currentStroke) {
                this.currentStroke = data.currentStroke;
                this.currentStroke.id = this.createId();
                if (this.currentStroke.points && this.currentStroke.points.length > 0) {
                    this.items.push(this.currentStroke);
                    this.addStrokeToSpatialIndex(this.currentStroke, this.items.length - 1);
                    this.currentStroke = null;
                    this.saveState();
                    this.rebuildSpatialIndex();
                    this.queueSave();
                    this.cachedOffscreenValid = false;
                    this.scheduleRender();
                    localStorage.removeItem('recovery_buffer');
                    return true;
                }
            }
            localStorage.removeItem('recovery_buffer');
            return false;
        } catch(e) {
            console.warn('Recovery failed:', e);
            return false;
        }
    }

    updateSaveState(state) {
        this.saveStatus = state; // renamed from saveState to avoid conflict with saveState() method
        const badge = document.getElementById('saveBadge');
        if (!badge) return;

        badge.classList.remove('saving-active', 'saved-active', 'error-active');

        switch (state) {
            case 'editing':
                badge.textContent = '📝 Editing...';
                break;
            case 'saved': {
                const now = new Date();
                badge.textContent = `✅ Saved ${now.toLocaleTimeString()}`;
                badge.classList.add('saved-active');
                break;
            }
            case 'saving':
                badge.textContent = '💾 Saving...';
                badge.classList.add('saving-active');
                break;
            case 'error':
                badge.textContent = '❌ Save Failed';
                badge.classList.add('error-active');
                break;
        }
    }

    highlightActiveNote() {
        document.querySelectorAll('.note-item').forEach(item => {
            item.classList.remove('active-note');
        });
        if (this.currentNoteId) {
            const activeNoteElement = document.querySelector(`.note-item[data-id="${this.currentNoteId}"]`);
            if (activeNoteElement) {
                activeNoteElement.classList.add('active-note');
            }
        }
    }

    serializeItem(item) { const c={...item}; delete c.imageElement; return c; }
    
    deserializeItem(data) { 
        const item = {...data}; 
        // Restore any necessary properties
        if (item.type === 'image' && item.imageUrl) {
            item.imageElement = new Image();
            item.imageElement.src = item.imageUrl;
        }
        return item; 
    }

    /* ── FAVORITE PENS ── */
    loadFavoritePens() {
        const saved = JSON.parse(localStorage.getItem('whiteboard_favorite_pens')||'null');
        return saved || [{ color:'#111827',width:3 },{ color:'#3b82f6',width:4 },{ color:'#ef4444',width:4 },{ color:'#22c55e',width:4 }];
    }

    saveFavoritePen() {
        const pen = { color:this.currentColor, width:this.brushSize };
        this.favoritePens = this.favoritePens.filter(p=>p.color!==pen.color||p.width!==pen.width);
        this.favoritePens.unshift(pen);
        this.favoritePens = this.favoritePens.slice(0,8);
        localStorage.setItem('whiteboard_favorite_pens', JSON.stringify(this.favoritePens));
        this.renderFavoritePens();
    }

    renderFavoritePens() {
        const qp = document.getElementById('quickPens');

        const config = {
            currentTool: this.currentTool,
            currentColor: this.currentColor,
            brushSize: this.brushSize,
            eraserSize: this.eraserSize,
            eraserMode: this.eraserMode,
            mode: this.mode,
            backgroundStyle: this.backgroundStyle,
            zoom: this.zoom
        };
        localStorage.setItem('whiteboard_tool_config', JSON.stringify(config));
    }

    loadToolConfig() {
        const saved = localStorage.getItem('whiteboard_tool_config');
        if (!saved) return;
        try {
            const config = JSON.parse(saved);
            if (config.currentTool) this.currentTool = config.currentTool;
            if (config.currentColor) this.currentColor = config.currentColor;
            if (config.brushSize) this.brushSize = config.brushSize;
            if (config.eraserSize) this.eraserSize = config.eraserSize;
            if (config.eraserMode) this.eraserMode = config.eraserMode;
            if (config.mode) this.mode = config.mode;
            if (config.backgroundStyle) this.backgroundStyle = config.backgroundStyle;
            if (config.zoom) this.zoom = config.zoom;
            
            // Apply loaded settings to UI
            this.dom.colorPicker.value = this.currentColor;
            this.dom.brushSize.value = this.brushSize;
            this.dom.sizeValue.innerText = this.brushSize.toFixed(1) + 'px';
            this.dom.eraserSize.value = this.eraserSize;
            this.dom.eraserSizeValue.innerText = this.eraserSize + 'px';
            this.setZoom(this.zoom);
            this.setMode(this.mode);
            this.setBackground(this.backgroundStyle);
            this.setEraserMode(this.eraserMode);
            this.setTool(this.currentTool);
        } catch(e) { console.error('Failed to load tool config', e); }
    }

    async restoreNotesFolderHandle() {
        if (!window.showDirectoryPicker || !window.indexedDB) return;
        try {
            const handle = await this.getStoredNotesFolderHandle();
            if (!handle) return;
            if (await handle.queryPermission({ mode: 'readwrite' }) !== 'granted') return;
            this.notesFolderHandle = handle;
            if (this.dom.folderSyncStatus) this.dom.folderSyncStatus.textContent = `Synced: ${handle.name}`;
        } catch {}
    }

    async storeNotesFolderHandle(handle) {
        if (!window.indexedDB) return;
        const db = await this.openWhiteboardDb();
        await new Promise((res, rej) => { const tx = db.transaction('settings', 'readwrite'); tx.objectStore('settings').put(handle, 'notesFolderHandle'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        db.close();
    }

    async getStoredNotesFolderHandle() {
        const db = await this.openWhiteboardDb();
        const handle = await new Promise((res, rej) => { const tx = db.transaction('settings', 'readonly'); const req = tx.objectStore('settings').get('notesFolderHandle'); req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error); });
        db.close();
        return handle;
    }

    openWhiteboardDb() {
        return new Promise((res, rej) => { const req = indexedDB.open('whiteboard_workspace_sync', 1); req.onupgradeneeded = () => req.result.createObjectStore('settings'); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
    }
